name: Production domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-domain-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  FOUNDATION_HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
  APEX_HOST: sozorockfoundation.org
  CANONICAL_HOST: www.sozorockfoundation.org
  REDIRECT_FUNCTION_NAME: SozoRockFoundationParentOrigin
  REDIRECT_API_NAME: SozoRockFoundationParentSite
  WWW_CERTIFICATE_ARN: arn:aws:acm:us-east-1:791860731989:certificate/d2b11522-63cb-4c7f-b5a8-c0c25a39a2f7

jobs:
  diagnose:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture public baseline
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/domain-report.md"
          {
            echo '## Production domain diagnostic and apex cutover'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '### Public baseline'
          } > "$report"

          for host in \
            sozorockfoundation.org \
            www.sozorockfoundation.org \
            health.sozorockfoundation.org \
            cbcap.sozorockfoundation.org \
            ai-lab.sozorockfoundation.org \
            institute.sozorockfoundation.org \
            sozorockhealth.com \
            www.sozorockhealth.com; do
            addresses="$(python3 - "$host" <<'PY'
          import socket, sys
          host = sys.argv[1]
          try:
              rows = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print(", ".join(rows) if rows else "none")
          except Exception:
              print("dns-failed")
          PY
          )"
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            echo "- \`${host}\`: addresses=\`${addresses}\`; status=\`${status:-probe-failed}\`; location=\`${location:-none}\`" >> "$report"
          done

          {
            echo
            echo '### Legacy Health public DNS'
            echo "- Nameservers: \`$(dig +short NS sozorockhealth.com | sort | paste -sd, - || true)\`"
            echo "- www CNAME: \`$(dig +short CNAME www.sozorockhealth.com | paste -sd, - || true)\`"
          } >> "$report"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Configure trusted Foundation AWS role
        id: aws_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationDomainInventory-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Provision certificate and verify regional apex redirect before DNS cutover
        id: cutover
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$REPORT_PATH"
          original_record="$RUNNER_TEMP/apex-record-original.json"
          dns_changed=0
          live_verified=0

          rollback_dns() {
            if [[ "$dns_changed" = "1" && "$live_verified" != "1" && -s "$original_record" ]]; then
              cat > "$RUNNER_TEMP/rollback.json" <<JSON
          {
            "Comment": "Rollback failed SozoRock Foundation apex redirect cutover",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": $(cat "$original_record")
            }]
          }
          JSON
              if change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/rollback.json" --query 'ChangeInfo.Id' --output text 2>/dev/null)"; then
                aws route53 wait resource-record-sets-changed --id "$change_id" || true
                echo '- Rollback: original apex Route 53 record restored after failed live verification.' >> "$report"
              else
                echo '- Rollback failed: manual Route 53 review is required before treating the apex as stable.' >> "$report"
              fi
            fi
          }
          trap rollback_dns EXIT

          {
            echo
            echo '### AWS redirect cutover'
            echo '- Trusted Foundation AWS role: assumed successfully.'
          } >> "$report"

          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"

          apex_record="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='${APEX_HOST}.' && Type=='A'] | [0]" \
            --output json)"
          test -n "$apex_record"
          test "$apex_record" != "null"
          jq -e '.AliasTarget.DNSName == "d1w2jx9m5e0d5u.cloudfront.net."' <<<"$apex_record" >/dev/null
          printf '%s\n' "$apex_record" > "$original_record"
          echo '- Preflight: the apex still points to the retired CloudFront endpoint expected by this cutover.' >> "$report"

          certificate_arn=""
          if existing_arn="$(aws acm list-certificates \
            --certificate-statuses ISSUED PENDING_VALIDATION \
            --query "CertificateSummaryList[?DomainName=='${APEX_HOST}'].CertificateArn | [0]" \
            --output text 2>/dev/null)" && [[ -n "$existing_arn" && "$existing_arn" != "None" ]]; then
            certificate_arn="$existing_arn"
            echo "- Apex certificate: reusing \`${certificate_arn}\`." >> "$report"
          else
            if ! certificate_arn="$(aws acm request-certificate \
              --domain-name "$APEX_HOST" \
              --validation-method DNS \
              --idempotency-token SozoRockApexRedirect \
              --options CertificateTransparencyLoggingPreference=ENABLED \
              --query CertificateArn \
              --output text 2>"$RUNNER_TEMP/cert-request.err")"; then
              echo "- Apex certificate request error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/cert-request.err" | sed 's/`/'"'"'/g')\`" >> "$report"
              exit 1
            fi
            echo "- Apex certificate: requested \`${certificate_arn}\`." >> "$report"
          fi
          test -n "$certificate_arn"
          test "$certificate_arn" != "None"

          cert_validated=0
          for _ in $(seq 1 180); do
            cert_json="$(aws acm describe-certificate --certificate-arn "$certificate_arn" --output json)"
            cert_status="$(jq -r '.Certificate.Status // ""' <<<"$cert_json")"
            if [[ "$cert_status" = "ISSUED" ]]; then
              cert_validated=1
              break
            fi
            if [[ "$cert_status" != "PENDING_VALIDATION" ]]; then
              echo "- Apex certificate entered unexpected state: \`${cert_status}\`." >> "$report"
              exit 1
            fi

            validation_name="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Name // ""' <<<"$cert_json")"
            validation_type="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Type // ""' <<<"$cert_json")"
            validation_value="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Value // ""' <<<"$cert_json")"
            if [[ -n "$validation_name" && -n "$validation_type" && -n "$validation_value" ]]; then
              cat > "$RUNNER_TEMP/cert-validation.json" <<JSON
          {
            "Comment": "Validate ACM certificate for SozoRock Foundation apex redirect",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${validation_name}",
                "Type": "${validation_type}",
                "TTL": 300,
                "ResourceRecords": [{"Value": "${validation_value}"}]
              }
            }]
          }
          JSON
              validation_change="$(aws route53 change-resource-record-sets \
                --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
                --change-batch "file://$RUNNER_TEMP/cert-validation.json" \
                --query 'ChangeInfo.Id' \
                --output text)"
              aws route53 wait resource-record-sets-changed --id "$validation_change"
            fi
            sleep 5
          done
          test "$cert_validated" = "1"
          echo "- Apex certificate: \`${certificate_arn}\` is ISSUED and DNS-validated." >> "$report"

          cat > "$RUNNER_TEMP/index.py" <<'PY'
          def handler(event, context):
              path = event.get('rawPath') or event.get('path') or '/'
              query = event.get('rawQueryString') or ''
              location = 'https://www.sozorockfoundation.org' + path
              if query:
                  location += '?' + query
              return {
                  'statusCode': 308,
                  'headers': {
                      'location': location,
                      'cache-control': 'public, max-age=300',
                      'x-content-type-options': 'nosniff'
                  },
                  'body': '',
                  'isBase64Encoded': False,
              }
          PY
          (
            cd "$RUNNER_TEMP"
            rm -f apex-origin.zip
            python3 -m zipfile -c apex-origin.zip index.py
          )

          aws lambda get-function --function-name "$REDIRECT_FUNCTION_NAME" >/dev/null
          aws lambda update-function-code \
            --function-name "$REDIRECT_FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/apex-origin.zip" >/dev/null
          for _ in $(seq 1 90); do
            state="$(aws lambda get-function-configuration --function-name "$REDIRECT_FUNCTION_NAME" --query 'State' --output text 2>/dev/null || true)"
            update_status="$(aws lambda get-function-configuration --function-name "$REDIRECT_FUNCTION_NAME" --query 'LastUpdateStatus' --output text 2>/dev/null || true)"
            if [[ "$state" = "Active" && ( "$update_status" = "Successful" || "$update_status" = "None" || -z "$update_status" ) ]]; then
              break
            fi
            test "$state" != "Failed"
            test "$update_status" != "Failed"
            sleep 2
          done

          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$REDIRECT_API_NAME" '.Items[]? | select(.Name==$name) | .ApiId' | head -n1)"
          test -n "$api_id"
          api_endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query 'ApiEndpoint' --output text)"
          test -n "$api_endpoint"

          api_headers="$RUNNER_TEMP/api-headers.txt"
          api_status="$(curl --silent --show-error --dump-header "$api_headers" --output /dev/null --max-time 30 --write-out '%{http_code}' "${api_endpoint}/publication/rrg-v1-2025?source=api-preflight")"
          test "$api_status" = "308"
          api_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$api_headers")"
          test "$api_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=api-preflight"
          echo '- Redirect Lambda and existing HTTP API verified before custom-domain or DNS changes.' >> "$report"

          if domain_json="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null)"; then
            current_cert="$(jq -r '.DomainNameConfigurations[0].CertificateArn // ""' <<<"$domain_json")"
            if [[ "$current_cert" != "$certificate_arn" ]]; then
              aws apigatewayv2 update-domain-name \
                --domain-name "$APEX_HOST" \
                --domain-name-configurations "CertificateArn=$certificate_arn,EndpointType=REGIONAL,SecurityPolicy=TLS_1_2" >/dev/null
            fi
          else
            aws apigatewayv2 create-domain-name \
              --domain-name "$APEX_HOST" \
              --domain-name-configurations "CertificateArn=$certificate_arn,EndpointType=REGIONAL,SecurityPolicy=TLS_1_2" >/dev/null
          fi

          domain_ready=0
          for _ in $(seq 1 120); do
            domain_json="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null || true)"
            domain_status="$(jq -r '.DomainNameConfigurations[0].DomainNameStatus // ""' <<<"${domain_json:-{}}")"
            if [[ "$domain_status" = "AVAILABLE" ]]; then
              domain_ready=1
              break
            fi
            sleep 5
          done
          test "$domain_ready" = "1"

          target="$(jq -r '.DomainNameConfigurations[0].ApiGatewayDomainName' <<<"$domain_json")"
          target_zone="$(jq -r '.DomainNameConfigurations[0].HostedZoneId' <<<"$domain_json")"
          test -n "$target"
          test "$target" != "null"
          test -n "$target_zone"
          test "$target_zone" != "null"

          mappings="$(aws apigatewayv2 get-api-mappings --domain-name "$APEX_HOST" --output json)"
          root_mapping="$(jq -r '.Items[]? | select((.ApiMappingKey // "") == "") | @base64' <<<"$mappings" | head -n1)"
          if [[ -n "$root_mapping" ]]; then
            mapped_api="$(printf '%s' "$root_mapping" | base64 --decode | jq -r '.ApiId')"
            mapped_stage="$(printf '%s' "$root_mapping" | base64 --decode | jq -r '.Stage')"
            test "$mapped_api" = "$api_id"
            test "$mapped_stage" = '$default'
          else
            aws apigatewayv2 create-api-mapping \
              --domain-name "$APEX_HOST" \
              --api-id "$api_id" \
              --stage '$default' >/dev/null
          fi

          target_ip="$(getent ahostsv4 "$target" | awk 'NR==1{print $1}')"
          test -n "$target_ip"
          direct_headers="$RUNNER_TEMP/direct-target-headers.txt"
          direct_status="$(curl --silent --show-error --dump-header "$direct_headers" --output /dev/null --max-time 30 --resolve "${APEX_HOST}:443:${target_ip}" --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=target-preflight")"
          test "$direct_status" = "308"
          direct_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$direct_headers")"
          test "$direct_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=target-preflight"
          echo '- Regional custom-domain target passed direct TLS and redirect verification before DNS cutover.' >> "$report"

          cat > "$RUNNER_TEMP/cutover.json" <<JSON
          {
            "Comment": "Cut over The SozoRock Foundation apex to permanent www redirect",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${APEX_HOST}.",
                "Type": "A",
                "AliasTarget": {
                  "HostedZoneId": "${target_zone}",
                  "DNSName": "${target}.",
                  "EvaluateTargetHealth": false
                }
              }
            }]
          }
          JSON
          change_id="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --change-batch "file://$RUNNER_TEMP/cutover.json" \
            --query 'ChangeInfo.Id' \
            --output text)"
          dns_changed=1
          aws route53 wait resource-record-sets-changed --id "$change_id"

          live_headers="$RUNNER_TEMP/live-apex-headers.txt"
          live_status="$(curl --silent --show-error --dump-header "$live_headers" --output /dev/null --max-time 30 --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=live-cutover")"
          test "$live_status" = "308"
          live_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$live_headers")"
          test "$live_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=live-cutover"

          canonical_status="$(curl --silent --show-error --output "$RUNNER_TEMP/canonical.html" --max-time 30 --write-out '%{http_code}' "https://${CANONICAL_HOST}/")"
          test "$canonical_status" = "200"
          grep -q 'Access. Assurance. Intelligence.' "$RUNNER_TEMP/canonical.html"

          live_verified=1
          echo 'apex_verified=true' >> "$GITHUB_OUTPUT"
          echo "- Live verification: \`https://${APEX_HOST}\` returns 308 to canonical www with path/query preserved; canonical identity check passed." >> "$report"

      - name: Record AWS trust or cutover failure
        if: steps.aws_auth.outcome != 'success' || steps.cutover.outcome != 'success'
        shell: bash
        run: |
          {
            echo
            echo '### Cutover status'
            if [[ "${{ steps.aws_auth.outcome }}" != "success" ]]; then
              echo '- AWS role could not be assumed. No DNS change was attempted.'
            else
              echo '- Regional apex cutover did not complete successfully. The workflow rolls DNS back if it had already changed.'
            fi
          } >> "$REPORT_PATH"

      - name: Capture post-run public state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo '### Post-run public state'
          } >> "$REPORT_PATH"
          for host in sozorockfoundation.org www.sozorockfoundation.org sozorockhealth.com www.sozorockhealth.com; do
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            echo "- \`${host}\`: status=\`${status:-probe-failed}\`; location=\`${location:-none}\`" >> "$REPORT_PATH"
          done

      - name: Publish production-domain receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce verified apex state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.aws_auth.outcome }}" = "success"
          test "${{ steps.cutover.outcome }}" = "success"
          test "${{ steps.cutover.outputs.apex_verified }}" = "true"
