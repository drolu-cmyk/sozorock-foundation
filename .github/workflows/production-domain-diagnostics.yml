name: Production domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-domain-diagnostics.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  id-token: write

concurrency:
  group: foundation-apex-cutover
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  FOUNDATION_HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
  APEX_HOST: sozorockfoundation.org
  CANONICAL_HOST: www.sozorockfoundation.org
  REDIRECT_API_NAME: SozoRockFoundationParentSite
  EXPECTED_STALE_APEX_TARGET: d1w2jx9m5e0d5u.cloudfront.net.
  RECEIPT_ISSUE: '84'

jobs:
  cutover:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure trusted Foundation AWS role
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationApexCutover-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Cut over apex without mutating the combined agent Lambda
        id: cutover
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/apex-report.md"
          original_record="$RUNNER_TEMP/apex-record-original.json"
          dns_changed=0
          live_verified=0

          rollback_dns() {
            if [[ "$dns_changed" = '1' && "$live_verified" != '1' && -s "$original_record" ]]; then
              jq -n --slurpfile record "$original_record" '{
                Comment:"Rollback failed SozoRock Foundation apex canonical cutover",
                Changes:[{Action:"UPSERT",ResourceRecordSet:$record[0]}]
              }' > "$RUNNER_TEMP/apex-rollback.json"
              if change_id="$(aws route53 change-resource-record-sets \
                --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
                --change-batch "file://$RUNNER_TEMP/apex-rollback.json" \
                --query 'ChangeInfo.Id' --output text 2>/dev/null)"; then
                aws route53 wait resource-record-sets-changed --id "$change_id" || true
                echo '- Rollback: original apex Route 53 record restored.' >> "$report"
              else
                echo '- Rollback failed: manual Route 53 review is required.' >> "$report"
              fi
            fi
          }
          trap rollback_dns EXIT

          {
            echo '## Foundation apex canonical cutover'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
          } > "$report"

          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"

          # Idempotent exit when the public apex is already correct.
          existing_headers="$RUNNER_TEMP/apex-existing-headers.txt"
          existing_status="$(curl --silent --show-error --dump-header "$existing_headers" --output /dev/null --max-time 20 --write-out '%{http_code}' \
            "https://${APEX_HOST}/publication/rrg-v1-2025?source=apex-idempotency" || true)"
          existing_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' "$existing_headers")"
          if [[ "$existing_status" = '308' && "$existing_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=apex-idempotency" ]]; then
            canonical_html="$RUNNER_TEMP/canonical-existing.html"
            canonical_status="$(curl --silent --show-error --output "$canonical_html" --max-time 20 --write-out '%{http_code}' "https://${CANONICAL_HOST}/")"
            test "$canonical_status" = '200'
            grep -q 'Access. Assurance. Intelligence.' "$canonical_html"
            echo '- Result: apex already returns the required permanent redirect and canonical identity is correct.' >> "$report"
            echo 'apex_verified=true' >> "$GITHUB_OUTPUT"
            echo "REPORT_PATH=$report" >> "$GITHUB_ENV"
            exit 0
          fi

          apex_record="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='${APEX_HOST}.' && Type=='A'] | [0]" \
            --output json)"
          test -n "$apex_record"
          test "$apex_record" != 'null'
          jq -e --arg expected "$EXPECTED_STALE_APEX_TARGET" '.AliasTarget.DNSName == $expected' <<<"$apex_record" >/dev/null
          printf '%s\n' "$apex_record" > "$original_record"
          echo "- Preflight: apex still points to expected retired endpoint \`${EXPECTED_STALE_APEX_TARGET}\`." >> "$report"

          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$REDIRECT_API_NAME" '.Items[]? | select(.Name == $name) | .ApiId' | head -n1)"
          test -n "$api_id"
          api_endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query ApiEndpoint --output text)"
          test -n "$api_endpoint"

          # The existing combined edge must already serve the public 308 and retain IAM protection.
          api_headers="$RUNNER_TEMP/api-preflight-headers.txt"
          api_status="$(curl --silent --show-error --dump-header "$api_headers" --output /dev/null --max-time 30 --write-out '%{http_code}' \
            "${api_endpoint}/publication/rrg-v1-2025?source=apex-preflight")"
          api_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' "$api_headers")"
          test "$api_status" = '308'
          test "$api_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=apex-preflight"

          routes="$(aws apigatewayv2 get-routes --api-id "$api_id" --output json)"
          for key in 'GET /internal/health' 'GET /internal/v1/graphs' 'POST /internal/v1/run'; do
            auth="$(jq -r --arg key "$key" '.Items[]? | select(.RouteKey == $key) | .AuthorizationType' <<<"$routes")"
            test "$auth" = 'AWS_IAM'
          done
          unauth_internal="$(curl --silent --show-error --output /dev/null --max-time 20 --write-out '%{http_code}' "${api_endpoint}/internal/health" || true)"
          test "$unauth_internal" = '403'
          echo '- Combined redirect and IAM-protected agent API verified before apex changes.' >> "$report"

          certificate_arn=''
          mapfile -t cert_arns < <(aws acm list-certificates \
            --certificate-statuses ISSUED PENDING_VALIDATION \
            --query 'CertificateSummaryList[].CertificateArn' --output text | tr '\t' '\n' | sed '/^$/d')
          for arn in "${cert_arns[@]}"; do
            cert="$(aws acm describe-certificate --certificate-arn "$arn" --output json)"
            if jq -e --arg host "$APEX_HOST" '.Certificate.SubjectAlternativeNames[]? | select(. == $host)' <<<"$cert" >/dev/null; then
              certificate_arn="$arn"
              break
            fi
          done

          if [[ -z "$certificate_arn" ]]; then
            if ! certificate_arn="$(aws acm request-certificate \
              --domain-name "$APEX_HOST" \
              --validation-method DNS \
              --idempotency-token SozoRockApexRedirect \
              --options CertificateTransparencyLoggingPreference=ENABLED \
              --query CertificateArn --output text 2>"$RUNNER_TEMP/acm-request.err")"; then
              echo "- ACM request blocked: \`$(tr '\n' ' ' < "$RUNNER_TEMP/acm-request.err" | sed 's/`/'"'"'/g')\`" >> "$report"
              exit 1
            fi
            echo "- ACM certificate requested: \`${certificate_arn}\`." >> "$report"
          else
            echo "- Reusing existing ACM certificate that explicitly covers the apex: \`${certificate_arn}\`." >> "$report"
          fi
          test -n "$certificate_arn"
          test "$certificate_arn" != 'None'

          cert_issued=0
          for _ in $(seq 1 180); do
            cert_json="$(aws acm describe-certificate --certificate-arn "$certificate_arn" --output json)"
            cert_status="$(jq -r '.Certificate.Status // ""' <<<"$cert_json")"
            if [[ "$cert_status" = 'ISSUED' ]]; then
              cert_issued=1
              break
            fi
            test "$cert_status" = 'PENDING_VALIDATION'
            validation_name="$(jq -r '.Certificate.DomainValidationOptions[]? | select(.DomainName == "'"$APEX_HOST"'") | .ResourceRecord.Name // ""' <<<"$cert_json" | head -n1)"
            validation_type="$(jq -r '.Certificate.DomainValidationOptions[]? | select(.DomainName == "'"$APEX_HOST"'") | .ResourceRecord.Type // ""' <<<"$cert_json" | head -n1)"
            validation_value="$(jq -r '.Certificate.DomainValidationOptions[]? | select(.DomainName == "'"$APEX_HOST"'") | .ResourceRecord.Value // ""' <<<"$cert_json" | head -n1)"
            if [[ -n "$validation_name" && "$validation_type" = 'CNAME' && -n "$validation_value" ]]; then
              jq -n \
                --arg name "$validation_name" \
                --arg value "$validation_value" \
                '{Comment:"Validate Foundation apex ACM certificate",Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"CNAME",TTL:300,ResourceRecords:[{Value:$value}]}}]}' \
                > "$RUNNER_TEMP/acm-validation.json"
              change_id="$(aws route53 change-resource-record-sets \
                --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
                --change-batch "file://$RUNNER_TEMP/acm-validation.json" \
                --query 'ChangeInfo.Id' --output text)"
              aws route53 wait resource-record-sets-changed --id "$change_id"
            fi
            sleep 5
          done
          test "$cert_issued" = '1'
          echo '- ACM certificate is ISSUED and DNS-validated.' >> "$report"

          if domain_json="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null)"; then
            current_cert="$(jq -r '.DomainNameConfigurations[0].CertificateArn // ""' <<<"$domain_json")"
            if [[ "$current_cert" != "$certificate_arn" ]]; then
              aws apigatewayv2 update-domain-name \
                --domain-name "$APEX_HOST" \
                --domain-name-configurations "CertificateArn=$certificate_arn,EndpointType=REGIONAL,SecurityPolicy=TLS_1_2" >/dev/null
            fi
          else
            aws apigatewayv2 create-domain-name \
              --domain-name "$APEX_HOST" \
              --domain-name-configurations "CertificateArn=$certificate_arn,EndpointType=REGIONAL,SecurityPolicy=TLS_1_2" >/dev/null
          fi

          domain_ready=0
          for _ in $(seq 1 120); do
            domain_json="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null || true)"
            if [[ -n "$domain_json" ]]; then
              domain_status="$(jq -r '.DomainNameConfigurations[0].DomainNameStatus // ""' <<<"$domain_json")"
            else
              domain_status=''
            fi
            if [[ "$domain_status" = 'AVAILABLE' ]]; then
              domain_ready=1
              break
            fi
            sleep 5
          done
          test "$domain_ready" = '1'

          target="$(jq -r '.DomainNameConfigurations[0].ApiGatewayDomainName' <<<"$domain_json")"
          target_zone="$(jq -r '.DomainNameConfigurations[0].HostedZoneId' <<<"$domain_json")"
          test -n "$target"
          test "$target" != 'null'
          test -n "$target_zone"
          test "$target_zone" != 'null'

          mappings="$(aws apigatewayv2 get-api-mappings --domain-name "$APEX_HOST" --output json)"
          root_mapping_id="$(jq -r '.Items[]? | select((.ApiMappingKey // "") == "") | .ApiMappingId' <<<"$mappings" | head -n1)"
          if [[ -n "$root_mapping_id" ]]; then
            mapped_api="$(jq -r --arg id "$root_mapping_id" '.Items[]? | select(.ApiMappingId == $id) | .ApiId' <<<"$mappings")"
            mapped_stage="$(jq -r --arg id "$root_mapping_id" '.Items[]? | select(.ApiMappingId == $id) | .Stage' <<<"$mappings")"
            test "$mapped_api" = "$api_id"
            test "$mapped_stage" = '$default'
          else
            aws apigatewayv2 create-api-mapping --domain-name "$APEX_HOST" --api-id "$api_id" --stage '$default' >/dev/null
          fi

          target_ip="$(getent ahostsv4 "$target" | awk 'NR==1{print $1}')"
          test -n "$target_ip"
          direct_headers="$RUNNER_TEMP/apex-direct-target-headers.txt"
          direct_status="$(curl --silent --show-error --dump-header "$direct_headers" --output /dev/null --max-time 30 \
            --resolve "${APEX_HOST}:443:${target_ip}" --write-out '%{http_code}' \
            "https://${APEX_HOST}/publication/rrg-v1-2025?source=target-preflight")"
          direct_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' "$direct_headers")"
          test "$direct_status" = '308'
          test "$direct_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=target-preflight"
          echo '- API Gateway apex custom domain verified directly before DNS cutover.' >> "$report"

          jq -n \
            --arg host "${APEX_HOST}." \
            --arg target "${target}." \
            --arg zone "$target_zone" \
            '{Comment:"Canonicalize Foundation apex to the verified combined edge",Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$host,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}}]}' \
            > "$RUNNER_TEMP/apex-cutover.json"
          change_id="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --change-batch "file://$RUNNER_TEMP/apex-cutover.json" \
            --query 'ChangeInfo.Id' --output text)"
          dns_changed=1
          aws route53 wait resource-record-sets-changed --id "$change_id"

          for _ in $(seq 1 60); do
            live_headers="$RUNNER_TEMP/apex-live-headers.txt"
            live_status="$(curl --silent --show-error --dump-header "$live_headers" --output /dev/null --max-time 20 --write-out '%{http_code}' \
              "https://${APEX_HOST}/publication/rrg-v1-2025?source=apex-cutover" || true)"
            live_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' "$live_headers")"
            if [[ "$live_status" = '308' && "$live_location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=apex-cutover" ]]; then
              live_verified=1
              break
            fi
            sleep 5
          done
          test "$live_verified" = '1'

          canonical_html="$RUNNER_TEMP/canonical.html"
          canonical_status="$(curl --silent --show-error --output "$canonical_html" --max-time 30 --write-out '%{http_code}' "https://${CANONICAL_HOST}/")"
          test "$canonical_status" = '200'
          grep -q 'Access. Assurance. Intelligence.' "$canonical_html"
          echo '- Live verification: apex returns permanent 308 with path/query preserved; canonical Foundation identity passed.' >> "$report"
          echo 'apex_verified=true' >> "$GITHUB_OUTPUT"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Record unavailable AWS trust
        if: steps.aws.outcome != 'success'
        shell: bash
        run: |
          report="$RUNNER_TEMP/apex-report.md"
          printf '## Foundation apex canonical cutover\n\n- Trusted Foundation AWS role could not be assumed. No AWS resource was changed.\n' > "$report"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Ensure report exists after failed cutover
        if: always()
        shell: bash
        run: |
          report="${REPORT_PATH:-$RUNNER_TEMP/apex-report.md}"
          if [[ ! -f "$report" ]]; then
            printf '## Foundation apex canonical cutover\n\n- Cutover failed before a detailed receipt was written. DNS rollback remains fail-closed.\n' > "$report"
          fi
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Publish production-domain receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Require verified apex state
        if: always()
        shell: bash
        run: |
          test "${{ steps.aws.outcome }}" = 'success'
          test "${{ steps.cutover.outcome }}" = 'success'
          test "${{ steps.cutover.outputs.apex_verified }}" = 'true'

      - name: Dispatch recovery finalization after verified diagnostics
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Dispatch from the same verified main revision so finalization uses
          # the current production response and equivalent bounded IAM policy contracts.
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/finalize-production-recovery.yml/dispatches" \
            -f ref=main
          echo 'Recovery finalization dispatched after verified production diagnostics.' >> "$GITHUB_STEP_SUMMARY"
