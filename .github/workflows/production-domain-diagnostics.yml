name: Production domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-domain-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  FOUNDATION_HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3

jobs:
  public-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS and HTTPS behavior
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            sozorockfoundation.org
            www.sozorockfoundation.org
            health.sozorockfoundation.org
            cbcap.sozorockfoundation.org
            ai-lab.sozorockfoundation.org
            sozorockhealth.com
            www.sozorockhealth.com
          )
          {
            echo '## Public DNS and HTTPS inventory'
            for host in "${hosts[@]}"; do
              echo
              echo "### $host"
              echo '```text'
              python3 - "$host" <<'PY'
          import socket, sys
          host = sys.argv[1]
          try:
              rows = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print("addresses:", ", ".join(rows) if rows else "none")
          except Exception as exc:
              print("dns_error:", type(exc).__name__, str(exc))
          PY
              curl --silent --show-error --head --max-time 20 "https://${host}/" \
                | awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^location:/ || /^server:/ || /^x-amz-cf-id:/ || /^cf-ray:/ {sub(/\r$/, ""); print}' \
                || echo 'https_probe_failed'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  aws-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Configure historical scoped AWS role for read-only inventory
        id: aws_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationDomainInventory-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Record unavailable AWS inventory
        if: steps.aws_auth.outcome != 'success'
        run: |
          {
            echo '## AWS inventory'
            echo 'The historical Foundation deployment role is no longer assumable from this repository. No AWS resource was changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect Route 53, Amplify, and CloudFront without mutation
        if: steps.aws_auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          aws route53 list-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='sozorockfoundation.org.' || Name=='www.sozorockfoundation.org.']" \
            --output json > "$tmp/foundation-records.json" || echo '[]' > "$tmp/foundation-records.json"

          aws route53 list-hosted-zones-by-name \
            --dns-name sozorockhealth.com \
            --max-items 5 \
            --output json > "$tmp/health-zones.json" || echo '{}' > "$tmp/health-zones.json"

          aws amplify list-apps \
            --query 'apps[].{appId:appId,name:name,repository:repository,defaultDomain:defaultDomain}' \
            --output json > "$tmp/amplify-apps.json" || echo '[]' > "$tmp/amplify-apps.json"

          aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && (contains(Aliases.Items, 'sozorockfoundation.org') || contains(Aliases.Items, 'www.sozorockfoundation.org') || contains(Aliases.Items, 'sozorockhealth.com') || contains(Aliases.Items, 'www.sozorockhealth.com'))].{Id:Id,DomainName:DomainName,Aliases:Aliases.Items,Enabled:Enabled,Status:Status}" \
            --output json > "$tmp/cloudfront.json" || echo '[]' > "$tmp/cloudfront.json"

          {
            echo '## AWS inventory'
            echo 'Read-only. This workflow performs no create, update, delete, deploy, invalidation, or DNS change.'
            echo
            echo '### Foundation Route 53 records'
            echo '```json'
            cat "$tmp/foundation-records.json"
            echo '```'
            echo
            echo '### sozorockhealth.com hosted-zone lookup'
            echo '```json'
            cat "$tmp/health-zones.json"
            echo '```'
            echo
            echo '### Amplify applications visible to the role'
            echo '```json'
            cat "$tmp/amplify-apps.json"
            echo '```'
            echo
            echo '### Matching CloudFront distributions'
            echo '```json'
            cat "$tmp/cloudfront.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
