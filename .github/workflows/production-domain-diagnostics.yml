name: Production domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-domain-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozoRockFoundationSiteDeployRole
  FOUNDATION_HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
  CERTIFICATE_ARN: arn:aws:acm:us-east-1:791860731989:certificate/d2b11522-63cb-4c7f-b5a8-c0c25a39a2f7
  LAMBDA_ROLE_ARN: arn:aws:iam::791860731989:role/SozoRockFoundationParentLambdaRole
  LEGACY_HEALTH_AMPLIFY_APP_ID: d3uqnxmsmefokf
  APEX_HOST: sozorockfoundation.org
  CANONICAL_HOST: www.sozorockfoundation.org
  REDIRECT_FUNCTION_NAME: SozoRockFoundationApexRedirect
  REDIRECT_API_NAME: SozoRockFoundationApexRedirect

jobs:
  diagnose:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture public baseline
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/domain-report.md"
          {
            echo '## Production domain diagnostic and repair'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '### Public baseline'
          } > "$report"
          for host in sozorockfoundation.org www.sozorockfoundation.org health.sozorockfoundation.org cbcap.sozorockfoundation.org ai-lab.sozorockfoundation.org institute.sozorockfoundation.org sozorockhealth.com www.sozorockhealth.com; do
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            addresses="$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, - || true)"
            echo "- \`${host}\`: addresses=\`${addresses:-dns-failed}\`; status=\`${status:-probe-failed}\`; location=\`${location:-none}\`" >> "$report"
          done
          {
            echo
            echo '### Legacy Health public DNS'
            echo "- Nameservers: \`$(dig +short NS sozorockhealth.com | sort | paste -sd, - || true)\`"
          } >> "$report"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Configure historical Foundation AWS role for read-only inventory
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationDomainInventory-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Inspect AWS state and repair Foundation apex
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$REPORT_PATH"
          old_record="$RUNNER_TEMP/apex-old-record.json"
          dns_changed=0
          verified=0

          rollback() {
            if [[ "$dns_changed" = "1" && "$verified" != "1" && -s "$old_record" ]]; then
              jq -n --argjson record "$(cat "$old_record")" '{Comment:"Rollback Foundation apex redirect",Changes:[{Action:"UPSERT",ResourceRecordSet:$record}]}' > "$RUNNER_TEMP/rollback.json"
              if change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/rollback.json" --query 'ChangeInfo.Id' --output text 2>/dev/null)"; then
                aws route53 wait resource-record-sets-changed --id "$change_id" || true
                echo '- Rollback restored the original apex Route 53 record.' >> "$report"
              else
                echo '- Rollback was rejected by AWS; manual Route 53 review is required.' >> "$report"
              fi
            fi
          }
          trap rollback EXIT

          {
            echo
            echo '### AWS inventory'
            echo '- Trusted Foundation AWS role: assumed successfully.'
          } >> "$report"

          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='sozorockfoundation.org.' || Name=='www.sozorockfoundation.org.'].{Name:Name,Type:Type,Alias:AliasTarget.DNSName,Values:ResourceRecords[].Value}" --output json)"
          echo "- Foundation apex/www records: \`${records}\`" >> "$report"

          if legacy_app="$(aws amplify get-app --app-id "$LEGACY_HEALTH_AMPLIFY_APP_ID" --query 'app.{appId:appId,name:name,repository:repository,defaultDomain:defaultDomain}' --output json 2>"$RUNNER_TEMP/amplify.err")"; then
            echo "- Legacy Health Amplify app: \`${legacy_app}\`" >> "$report"
          else
            echo "- Legacy Health Amplify lookup: \`$(tr '\n' ' ' < "$RUNNER_TEMP/amplify.err" | sed 's/`/'"'"'/g')\`" >> "$report"
          fi

          {
            echo
            echo '### Foundation apex repair'
          } >> "$report"

          cert="$(aws acm describe-certificate --certificate-arn "$CERTIFICATE_ARN" --query 'Certificate.{Status:Status,SANs:SubjectAlternativeNames}' --output json 2>"$RUNNER_TEMP/cert.err" || true)"
          if [[ -z "$cert" ]]; then
            echo "- Certificate preflight error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/cert.err" | sed 's/`/'"'"'/g')\`" >> "$report"
            exit 1
          fi
          test "$(jq -r '.Status' <<<"$cert")" = "ISSUED"
          if [[ "$(jq --arg host "$APEX_HOST" '[.SANs[]? | select(. == $host)] | length' <<<"$cert")" != "1" ]]; then
            echo '- Certificate preflight stopped: the known issued certificate does not cover the apex. No DNS change made.' >> "$report"
            exit 1
          fi
          echo '- Certificate preflight: issued certificate covers the apex.' >> "$report"

          current="$(aws route53 list-resource-record-sets --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='${APEX_HOST}.' && Type=='A'] | [0]" --output json)"
          test -n "$current"; test "$current" != "null"
          printf '%s' "$current" > "$old_record"
          current_alias="$(jq -r '.AliasTarget.DNSName // ""' <<<"$current")"
          current_alias="${current_alias%.}."
          if [[ "$current_alias" != 'd1w2jx9m5e0d5u.cloudfront.net.' ]]; then
            echo "- DNS preflight stopped: unexpected current apex alias \`${current_alias}\`." >> "$report"
            exit 1
          fi

          cat > "$RUNNER_TEMP/index.py" <<'PY'
          def handler(event, context):
              path = event.get("rawPath") or "/"
              query = event.get("rawQueryString") or ""
              location = "https://www.sozorockfoundation.org" + path + (("?" + query) if query else "")
              return {"statusCode": 308, "headers": {"location": location, "cache-control": "public, max-age=300", "strict-transport-security": "max-age=31536000", "x-content-type-options": "nosniff"}, "body": ""}
          PY
          (cd "$RUNNER_TEMP" && python3 -m zipfile -c redirect.zip index.py)

          if aws lambda get-function --function-name "$REDIRECT_FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-configuration --function-name "$REDIRECT_FUNCTION_NAME" --runtime python3.13 --handler index.handler --role "$LAMBDA_ROLE_ARN" --memory-size 128 --timeout 5 >/dev/null
            aws lambda wait function-updated-v2 --function-name "$REDIRECT_FUNCTION_NAME"
            aws lambda update-function-code --function-name "$REDIRECT_FUNCTION_NAME" --zip-file "fileb://$RUNNER_TEMP/redirect.zip" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$REDIRECT_FUNCTION_NAME"
          else
            aws lambda create-function --function-name "$REDIRECT_FUNCTION_NAME" --runtime python3.13 --handler index.handler --role "$LAMBDA_ROLE_ARN" --zip-file "fileb://$RUNNER_TEMP/redirect.zip" --memory-size 128 --timeout 5 >/dev/null
            aws lambda wait function-active-v2 --function-name "$REDIRECT_FUNCTION_NAME"
          fi
          function_arn="$(aws lambda get-function --function-name "$REDIRECT_FUNCTION_NAME" --query 'Configuration.FunctionArn' --output text)"

          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$REDIRECT_API_NAME" '.Items[]? | select(.Name==$name) | .ApiId' | head -n1)"
          if [[ -z "$api_id" ]]; then
            api_id="$(aws apigatewayv2 create-api --name "$REDIRECT_API_NAME" --protocol-type HTTP --target "$function_arn" --query 'ApiId' --output text)"
          fi
          integration_id="$(aws apigatewayv2 get-integrations --api-id "$api_id" --output json | jq -r --arg arn "$function_arn" '.Items[]? | select(.IntegrationUri==$arn) | .IntegrationId' | head -n1)"
          if [[ -z "$integration_id" ]]; then
            integration_id="$(aws apigatewayv2 create-integration --api-id "$api_id" --integration-type AWS_PROXY --integration-uri "$function_arn" --payload-format-version 2.0 --query 'IntegrationId' --output text)"
          fi
          route_id="$(aws apigatewayv2 get-routes --api-id "$api_id" --output json | jq -r '.Items[]? | select(.RouteKey=="$default") | .RouteId' | head -n1)"
          if [[ -z "$route_id" ]]; then
            aws apigatewayv2 create-route --api-id "$api_id" --route-key '$default' --target "integrations/$integration_id" >/dev/null
          else
            aws apigatewayv2 update-route --api-id "$api_id" --route-id "$route_id" --target "integrations/$integration_id" >/dev/null
          fi
          stage_count="$(aws apigatewayv2 get-stages --api-id "$api_id" --output json | jq -r '[.Items[]? | select(.StageName=="$default")] | length')"
          if [[ "$stage_count" = "0" ]]; then
            aws apigatewayv2 create-stage --api-id "$api_id" --stage-name '$default' --auto-deploy >/dev/null
          else
            aws apigatewayv2 update-stage --api-id "$api_id" --stage-name '$default' --auto-deploy >/dev/null
          fi
          aws lambda remove-permission --function-name "$REDIRECT_FUNCTION_NAME" --statement-id AllowApexRedirectApi >/dev/null 2>&1 || true
          aws lambda add-permission --function-name "$REDIRECT_FUNCTION_NAME" --statement-id AllowApexRedirectApi --action lambda:InvokeFunction --principal apigateway.amazonaws.com --source-arn "arn:aws:execute-api:${AWS_REGION}:791860731989:${api_id}/*" >/dev/null

          endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query 'ApiEndpoint' --output text)"
          headers="$RUNNER_TEMP/endpoint.headers"
          status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --max-time 30 --write-out '%{http_code}' "${endpoint}/publication/rrg-v1-2025?source=endpoint")"
          test "$status" = "308"
          test "$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$headers")" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=endpoint"

          if ! domain="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null)"; then
            aws apigatewayv2 create-domain-name --domain-name "$APEX_HOST" --domain-name-configurations "CertificateArn=$CERTIFICATE_ARN,EndpointType=REGIONAL,SecurityPolicy=TLS_1_2" >/dev/null
          fi
          ready=0
          for _ in $(seq 1 120); do
            domain="$(aws apigatewayv2 get-domain-name --domain-name "$APEX_HOST" --output json 2>/dev/null || true)"
            domain_status="$(jq -r '.DomainNameConfigurations[0].DomainNameStatus // ""' <<<"${domain:-{}}")"
            if [[ "$domain_status" = "AVAILABLE" ]]; then ready=1; break; fi
            if [[ "$domain_status" = "FAILED" ]]; then exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          target="$(jq -r '.DomainNameConfigurations[0].ApiGatewayDomainName' <<<"$domain")"
          target_zone="$(jq -r '.DomainNameConfigurations[0].HostedZoneId' <<<"$domain")"

          mapping_id="$(aws apigatewayv2 get-api-mappings --domain-name "$APEX_HOST" --output json | jq -r '.Items[]? | select((.ApiMappingKey // "")=="") | .ApiMappingId' | head -n1)"
          if [[ -z "$mapping_id" ]]; then
            aws apigatewayv2 create-api-mapping --domain-name "$APEX_HOST" --api-id "$api_id" --stage '$default' >/dev/null
          else
            aws apigatewayv2 update-api-mapping --domain-name "$APEX_HOST" --api-mapping-id "$mapping_id" --api-id "$api_id" --stage '$default' >/dev/null
          fi

          direct_ok=0
          for _ in $(seq 1 60); do
            target_ip="$(getent ahostsv4 "$target" | awk 'NR==1{print $1}' || true)"
            if [[ -n "$target_ip" ]]; then
              headers="$RUNNER_TEMP/direct.headers"
              status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --max-time 20 --write-out '%{http_code}' --resolve "${APEX_HOST}:443:${target_ip}" "https://${APEX_HOST}/publication/rrg-v1-2025?source=direct" || true)"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$headers" 2>/dev/null || true)"
              if [[ "$status" = "308" && "$location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=direct" ]]; then direct_ok=1; break; fi
            fi
            sleep 5
          done
          test "$direct_ok" = "1"
          echo '- Direct pre-DNS verification passed.' >> "$report"

          target_dot="${target%.}."
          jq -n --arg name "${APEX_HOST}." --arg target "$target_dot" --arg zone "$target_zone" '{Comment:"Cut Foundation apex to canonical www redirect",Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}}]}' > "$RUNNER_TEMP/cutover.json"
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/cutover.json" --query 'ChangeInfo.Id' --output text)"
          dns_changed=1
          aws route53 wait resource-record-sets-changed --id "$change_id"

          public_ok=0
          for _ in $(seq 1 60); do
            headers="$RUNNER_TEMP/live.headers"
            status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --max-time 20 --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=apex-cutover" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$headers" 2>/dev/null || true)"
            if [[ "$status" = "308" && "$location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=apex-cutover" ]]; then public_ok=1; break; fi
            sleep 5
          done
          test "$public_ok" = "1"
          canonical="$(curl --silent --show-error --max-time 30 "https://${CANONICAL_HOST}/")"
          grep -q 'Access. Assurance. Intelligence.' <<<"$canonical"
          verified=1
          echo '- Live apex verification passed: permanent 308 to canonical www with path/query preserved.' >> "$report"
          echo 'apex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Capture post-run public state
        if: always()
        shell: bash
        run: |
          {
            echo
            echo '### Post-run public state'
          } >> "$REPORT_PATH"
          for host in sozorockfoundation.org www.sozorockfoundation.org sozorockhealth.com www.sozorockhealth.com; do
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            echo "- \`${host}\`: status=\`${status:-probe-failed}\`; location=\`${location:-none}\`" >> "$REPORT_PATH"
          done

      - name: Publish production-domain receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Require verified Foundation apex repair
        if: always()
        shell: bash
        run: |
          test "${{ steps.repair.outcome }}" = "success"
          test "${{ steps.repair.outputs.apex_verified }}" = "true"
