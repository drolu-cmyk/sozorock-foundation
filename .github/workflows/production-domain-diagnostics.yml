name: Production domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-domain-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  FOUNDATION_HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
  LEGACY_HEALTH_AMPLIFY_APP_ID: d3uqnxmsmefokf
  APEX_HOST: sozorockfoundation.org
  CANONICAL_HOST: www.sozorockfoundation.org
  REDIRECT_FUNCTION_NAME: sozorockfoundation-apex-redirect

jobs:
  diagnose:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture public domain baseline
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/domain-report.md"
          {
            echo '## Production domain diagnostic and repair'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '### Public baseline'
          } > "$report"

          for host in \
            sozorockfoundation.org \
            www.sozorockfoundation.org \
            health.sozorockfoundation.org \
            cbcap.sozorockfoundation.org \
            ai-lab.sozorockfoundation.org \
            institute.sozorockfoundation.org \
            sozorockhealth.com \
            www.sozorockhealth.com; do
            addresses="$(python3 - "$host" <<'PY'
          import socket, sys
          host = sys.argv[1]
          try:
              rows = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print(", ".join(rows) if rows else "none")
          except Exception:
              print("dns-failed")
          PY
          )"
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/\r$/, ""); sub(/^server:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            echo "- \`${host}\`: addresses=\`${addresses}\`; status=\`${status:-probe-failed}\`; location=\`${location:-none}\`; server=\`${server:-unspecified}\`" >> "$report"
          done

          {
            echo
            echo '### Legacy Health public DNS'
            echo "- Nameservers: \`$(dig +short NS sozorockhealth.com | sort | paste -sd, - || true)\`"
            echo "- www CNAME: \`$(dig +short CNAME www.sozorockhealth.com | paste -sd, - || true)\`"
          } >> "$report"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Configure historical Foundation AWS role for read-only inventory
        id: aws_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationDomainInventory-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Inspect AWS state and repair Foundation apex
        id: repair
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$REPORT_PATH"
          original="$RUNNER_TEMP/distribution-original-config.json"
          distribution_id=""
          distribution_updated=0
          live_verified=0

          rollback_if_needed() {
            if [[ "$distribution_updated" = "1" && "$live_verified" != "1" && -n "$distribution_id" && -s "$original" ]]; then
              current_etag="$(aws cloudfront get-distribution-config --id "$distribution_id" --query ETag --output text 2>/dev/null || true)"
              if [[ -n "$current_etag" && "$current_etag" != "None" ]]; then
                if aws cloudfront update-distribution \
                  --id "$distribution_id" \
                  --if-match "$current_etag" \
                  --distribution-config "file://$original" >/dev/null 2>&1; then
                  aws cloudfront wait distribution-deployed --id "$distribution_id" || true
                  echo '- Rollback: original CloudFront distribution configuration restored after failed live verification.' >> "$report"
                else
                  echo '- Rollback: attempted but AWS rejected restoration. Manual AWS review is required before treating apex as stable.' >> "$report"
                fi
              fi
            fi
          }
          trap rollback_if_needed EXIT

          {
            echo
            echo '### AWS domain inventory'
            echo '- Trusted Foundation AWS role: assumed successfully.'
          } >> "$report"

          records="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='sozorockfoundation.org.' || Name=='www.sozorockfoundation.org.'].{Name:Name,Type:Type,Alias:AliasTarget.DNSName,Values:ResourceRecords[].Value}" \
            --output json)"
          echo "- Foundation Route 53 apex/www records: \`${records}\`" >> "$report"

          if health_zones="$(aws route53 list-hosted-zones-by-name --dns-name sozorockhealth.com --max-items 5 --query "HostedZones[?Name=='sozorockhealth.com.'].{Id:Id,Name:Name,Private:Config.PrivateZone}" --output json 2>"$RUNNER_TEMP/health-zone.err")"; then
            echo "- Route 53 hosted zones matching \`sozorockhealth.com\`: \`${health_zones}\`" >> "$report"
          else
            echo "- Route 53 legacy Health lookup error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/health-zone.err" | sed 's/`/'"'"'/g')\`" >> "$report"
          fi

          if legacy_app="$(aws amplify get-app --app-id "$LEGACY_HEALTH_AMPLIFY_APP_ID" --query 'app.{appId:appId,name:name,repository:repository,defaultDomain:defaultDomain,platform:platform}' --output json 2>"$RUNNER_TEMP/legacy-app.err")"; then
            echo "- Legacy Health Amplify app: \`${legacy_app}\`" >> "$report"
            if legacy_domain="$(aws amplify get-domain-association --app-id "$LEGACY_HEALTH_AMPLIFY_APP_ID" --domain-name sozorockhealth.com --query 'domainAssociation.{domain:domainName,status:domainStatus,updateStatus:updateStatus,subdomains:subDomains[].{prefix:subDomainSetting.prefix,branch:subDomainSetting.branchName,dnsRecord:dnsRecord}}' --output json 2>"$RUNNER_TEMP/legacy-domain.err")"; then
              echo "- Legacy Health Amplify domain association: \`${legacy_domain}\`" >> "$report"
            else
              echo "- Legacy Health domain-association lookup error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/legacy-domain.err" | sed 's/`/'"'"'/g')\`" >> "$report"
            fi
          else
            echo "- Legacy Health Amplify app lookup error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/legacy-app.err" | sed 's/`/'"'"'/g')\`" >> "$report"
          fi

          {
            echo
            echo '### Foundation apex repair'
          } >> "$report"

          alias_target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$FOUNDATION_HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='${APEX_HOST}.' && Type=='A'].AliasTarget.DNSName | [0]" \
            --output text)"
          test -n "$alias_target"
          test "$alias_target" != "None"
          cloudfront_domain="${alias_target%.}"

          if ! distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${cloudfront_domain}'].Id | [0]" \
            --output text 2>"$RUNNER_TEMP/cloudfront-list.err")"; then
            echo "- Preflight error: \`$(tr '\n' ' ' < "$RUNNER_TEMP/cloudfront-list.err" | sed 's/`/'"'"'/g')\`" >> "$report"
            exit 1
          fi
          test -n "$distribution_id"
          test "$distribution_id" != "None"

          before="$RUNNER_TEMP/distribution-before.json"
          aws cloudfront get-distribution-config --id "$distribution_id" --output json > "$before"
          jq '.DistributionConfig' "$before" > "$original"
          alias_count="$(jq --arg host "$APEX_HOST" '[.DistributionConfig.Aliases.Items[]? | select(. == $host)] | length' "$before")"
          test "$alias_count" = "1"
          existing_functions="$(jq '.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Quantity // 0' "$before")"
          existing_viewer_lambdas="$(jq '[.DistributionConfig.DefaultCacheBehavior.LambdaFunctionAssociations.Items[]? | select(.EventType == "viewer-request")] | length' "$before")"
          if [[ "$existing_functions" != "0" || "$existing_viewer_lambdas" != "0" ]]; then
            echo '- Preflight stopped: existing viewer-request code is attached; no distribution change made.' >> "$report"
            exit 1
          fi
          echo "- Preflight: exact apex alias maps to CloudFront distribution \`${distribution_id}\` (\`${cloudfront_domain}\`); no existing viewer-request code." >> "$report"

          cat > "$RUNNER_TEMP/apex-redirect.js" <<'JS'
          function encodeQuery(querystring) {
            var parts = [];
            for (var key in querystring) {
              if (!Object.prototype.hasOwnProperty.call(querystring, key)) continue;
              var item = querystring[key];
              if (item.multiValue) {
                for (var i = 0; i < item.multiValue.length; i++) {
                  parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(item.multiValue[i].value));
                }
              } else if (item.value !== undefined) {
                parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(item.value));
              }
            }
            return parts.length ? '?' + parts.join('&') : '';
          }
          function handler(event) {
            var request = event.request;
            var host = request.headers.host && request.headers.host.value;
            if (host !== 'sozorockfoundation.org') return request;
            return {
              statusCode: 308,
              statusDescription: 'Permanent Redirect',
              headers: {
                location: { value: 'https://www.sozorockfoundation.org' + request.uri + encodeQuery(request.querystring || {}) },
                'cache-control': { value: 'public, max-age=300' }
              }
            };
          }
          JS

          if aws cloudfront describe-function --name "$REDIRECT_FUNCTION_NAME" --stage DEVELOPMENT >/dev/null 2>&1; then
            function_etag="$(aws cloudfront describe-function --name "$REDIRECT_FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
            aws cloudfront update-function \
              --name "$REDIRECT_FUNCTION_NAME" \
              --if-match "$function_etag" \
              --function-config Comment='Permanent apex-to-www redirect for The SozoRock Foundation',Runtime=cloudfront-js-2.0 \
              --function-code "fileb://$RUNNER_TEMP/apex-redirect.js" >/dev/null
          else
            aws cloudfront create-function \
              --name "$REDIRECT_FUNCTION_NAME" \
              --function-config Comment='Permanent apex-to-www redirect for The SozoRock Foundation',Runtime=cloudfront-js-2.0 \
              --function-code "fileb://$RUNNER_TEMP/apex-redirect.js" >/dev/null
          fi
          development_etag="$(aws cloudfront describe-function --name "$REDIRECT_FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          publish_json="$(aws cloudfront publish-function --name "$REDIRECT_FUNCTION_NAME" --if-match "$development_etag" --output json)"
          function_arn="$(jq -r '.FunctionSummary.FunctionMetadata.FunctionARN' <<<"$publish_json")"
          test -n "$function_arn"
          test "$function_arn" != "null"

          updated="$RUNNER_TEMP/distribution-updated-config.json"
          jq --arg arn "$function_arn" \
            '.DistributionConfig | .DefaultCacheBehavior.FunctionAssociations = {"Quantity":1,"Items":[{"FunctionARN":$arn,"EventType":"viewer-request"}]}' \
            "$before" > "$updated"
          aws cloudfront update-distribution \
            --id "$distribution_id" \
            --if-match "$(jq -r '.ETag' "$before")" \
            --distribution-config "file://$updated" >/dev/null
          distribution_updated=1
          aws cloudfront wait distribution-deployed --id "$distribution_id"

          headers="$RUNNER_TEMP/apex-verify-headers.txt"
          status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --max-time 30 --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=apex-cutover")"
          test "$status" = "308"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$headers")"
          test "$location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=apex-cutover"
          canonical_status="$(curl --silent --show-error --output "$RUNNER_TEMP/canonical.html" --max-time 30 --write-out '%{http_code}' "https://${CANONICAL_HOST}/")"
          test "$canonical_status" = "200"
          grep -q 'Access. Assurance. Intelligence.' "$RUNNER_TEMP/canonical.html"
          live_verified=1
          echo '- Live verification: apex returns 308 to canonical www with path/query preserved; canonical identity check passed.' >> "$report"
          echo 'apex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Record unavailable AWS trust
        if: steps.aws_auth.outcome != 'success'
        run: |
          {
            echo
            echo '### AWS domain inventory'
            echo '- Trusted Foundation AWS role could not be assumed. No AWS resource was changed.'
          } >> "$REPORT_PATH"

      - name: Capture post-run public state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo '### Post-run public state'
          } >> "$REPORT_PATH"
          for host in sozorockfoundation.org www.sozorockfoundation.org sozorockhealth.com www.sozorockhealth.com; do
            headers="$(curl --silent --show-error --head --max-time 20 "https://${host}/" 2>/dev/null || true)"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            echo "- \`${host}\`: status=\`${status:-probe-failed}\`; location=\`${location:-none}\`" >> "$REPORT_PATH"
          done

      - name: Publish production-domain receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Require verified Foundation apex repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.aws_auth.outcome }}" = "success"
          test "${{ steps.repair.outcome }}" = "success"
          test "${{ steps.repair.outputs.apex_verified }}" = "true"
