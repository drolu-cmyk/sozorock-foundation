name: Self-recover approved release visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-recover-release-assets.yml
  issues:
    types: [opened]
  pull_request:
    branches: [main]
    paths:
      - .github/recovery-trigger

permissions:
  contents: write
  issues: write

jobs:
  recover:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-foundation' &&
      (github.event_name == 'push' || github.event_name == 'pull_request' ||
       (github.event.issue.user.login == 'drolu-cmyk' &&
        github.event.issue.title == 'recover-release-assets'))
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: release/final-responsive-copy-routing
      DIAGNOSTIC_ISSUE: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Recover and validate approved visual assets
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/recovery.log) 2>&1
          mkdir -p site/assets/leadership

          valid_image() {
            local file="$1"
            [ -s "$file" ] && [ "$(wc -c < "$file")" -gt 2500 ] || return 1
            case "$(file -b --mime-type "$file")" in image/jpeg|image/png|image/webp) return 0;; *) return 1;; esac
          }

          fetch_image() {
            local out="$1"; shift
            local url tmp="${out}.tmp"
            rm -f "$out" "$tmp"
            for url in "$@"; do
              echo "Trying $url"
              if curl -fL --retry 2 --connect-timeout 12 --max-time 35 -A 'Mozilla/5.0 (compatible; SozoRockFoundationRecovery/1.0)' "$url" -o "$tmp"; then
                if valid_image "$tmp"; then
                  echo "Recovered $out from $url"
                  mv "$tmp" "$out"
                  return 0
                fi
                echo "Rejected non-image or undersized response from $url"
              fi
              rm -f "$tmp"
            done
            echo "FAILED $out"
            return 1
          }

          fetch_image site/assets/leadership/nike-oye.png \
            'https://sozorockfoundation.org/m1.png' \
            'https://www.sozorockfoundation.org/m1.png'
          fetch_image site/assets/leadership/anthony-abraham.png \
            'https://sozorockfoundation.org/m2.png' \
            'https://www.sozorockfoundation.org/m2.png'
          fetch_image site/assets/leadership/jordan-hare.png \
            'https://sozorockfoundation.org/m3.png' \
            'https://www.sozorockfoundation.org/m3.png'
          fetch_image site/assets/leadership/oluwabiyi-adeyemo.png \
            'https://sozorockfoundation.org/m4.png' \
            'https://www.sozorockfoundation.org/m4.png'

          # ISBN-matched publisher-distributed covers served by Readings' image CDN.
          fetch_image site/assets/rrg-cover.jpg \
            'https://thumbs.readings.com.au/-ei5Iho6pK-ocs4dh7Y_XSpjrtw%3D/0x500/https%3A//readings-v4-production.s3.amazonaws.com/assets/267/26c/c0f/26726cc0f73edc2df927609257afa02bf06312e0/979899364771520251222-2-g7cugq.jpg'
          fetch_image site/assets/rebs-cover.jpg \
            'https://thumbs.readings.com.au/WNoEajjp7urRl6ZZR_Lo0zL2Eiw%3D/0x500/https%3A//readings-v4-production.s3.amazonaws.com/assets/8b0/e20/58d/8b0e2058d15a6a7274a3df4bc067c28a75c70f1a/979899364770820251222-2-gw927x.jpg'

          for f in \
            site/assets/leadership/nike-oye.png \
            site/assets/leadership/anthony-abraham.png \
            site/assets/leadership/jordan-hare.png \
            site/assets/leadership/oluwabiyi-adeyemo.png \
            site/assets/rrg-cover.jpg \
            site/assets/rebs-cover.jpg; do
            valid_image "$f"
            file "$f"
            sha256sum "$f"
          done

      - name: Commit recovered assets to the release branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/recovery.log) 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/leadership/ site/assets/rrg-cover.jpg site/assets/rebs-cover.jpg
          if git diff --cached --quiet; then
            echo 'Approved visual assets already present.'
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'fix(assets): restore approved publication covers and leadership portraits'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish recovery diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ASSET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Release asset recovery run ${GITHUB_RUN_ID}: **${JOB_STATUS^^}**"
            echo
            echo "Trigger: \`${GITHUB_EVENT_NAME}\`"
            if [ -n "${ASSET_SHA:-}" ]; then echo "Release branch asset commit: \`${ASSET_SHA}\`"; fi
            echo
            echo '```text'
            if [ -f /tmp/recovery.log ]; then tail -n 100 /tmp/recovery.log; else echo 'No recovery log was produced.'; fi
            echo '```'
          } >/tmp/recovery-comment.md
          gh issue comment "$DIAGNOSTIC_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/recovery-comment.md
