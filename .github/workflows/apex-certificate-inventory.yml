name: Apex certificate inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apex-certificate-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  APEX_HOST: sozorockfoundation.org

jobs:
  inventory:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure trusted Foundation AWS role
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationApexCertInventory-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Inventory issued and pending ACM certificates by SAN
        id: inventory
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          report="$RUNNER_TEMP/apex-cert-inventory.md"
          {
            echo '## Apex certificate SAN inventory'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > "$report"

          match=''
          mapfile -t arns < <(aws acm list-certificates \
            --certificate-statuses ISSUED PENDING_VALIDATION \
            --query 'CertificateSummaryList[].CertificateArn' \
            --output text | tr '\t' '\n' | sed '/^$/d')

          echo "- Certificates visible to role: ${#arns[@]}" >> "$report"
          for arn in "${arns[@]}"; do
            cert="$(aws acm describe-certificate --certificate-arn "$arn" --output json)"
            status="$(jq -r '.Certificate.Status // ""' <<<"$cert")"
            domain="$(jq -r '.Certificate.DomainName // ""' <<<"$cert")"
            sans="$(jq -c '.Certificate.SubjectAlternativeNames // []' <<<"$cert")"
            echo "- \`${arn}\`: status=\`${status}\`; primary=\`${domain}\`; SANs=\`${sans}\`" >> "$report"
            if jq -e --arg host "$APEX_HOST" '.Certificate.SubjectAlternativeNames[]? | select(. == $host)' <<<"$cert" >/dev/null; then
              match="$arn"
            fi
          done

          if [[ -n "$match" ]]; then
            echo "- Result: existing certificate explicitly covers \`${APEX_HOST}\`: \`${match}\`." >> "$report"
            echo "certificate_arn=$match" >> "$GITHUB_OUTPUT"
            echo 'apex_cert_found=true' >> "$GITHUB_OUTPUT"
          else
            echo "- Result: no visible existing certificate explicitly covers \`${APEX_HOST}\`." >> "$report"
            echo 'apex_cert_found=false' >> "$GITHUB_OUTPUT"
          fi
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Record unavailable AWS inventory
        if: steps.aws.outcome != 'success' || steps.inventory.outcome != 'success'
        shell: bash
        run: |
          report="${REPORT_PATH:-$RUNNER_TEMP/apex-cert-inventory.md}"
          if [[ ! -f "$report" ]]; then
            printf '## Apex certificate SAN inventory\n\n' > "$report"
          fi
          if [[ "${{ steps.aws.outcome }}" != "success" ]]; then
            echo '- Result: trusted AWS role could not be assumed; no AWS resource was changed.' >> "$report"
          else
            echo '- Result: certificate inventory failed; no AWS resource was changed.' >> "$report"
          fi
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Publish inventory receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce successful inventory
        if: always()
        shell: bash
        run: |
          test "${{ steps.aws.outcome }}" = "success"
          test "${{ steps.inventory.outcome }}" = "success"
