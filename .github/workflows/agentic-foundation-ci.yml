name: Foundation site and agents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Block vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

      - name: Check committed source
        run: python3 scripts/check-tracked-secrets.py --self-test

      - name: Install parent site dependencies
        run: npm ci

      - name: Build parent site
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites

      - name: Validate AWS CloudFront release contract
        run: npm run test:aws

      - name: Audit production dependencies
        run: bash scripts/audit-npm-production.sh

      - name: Report every dependency advisory, including development tools
        run: |
          for dir in . services/foundation-agents media/overview; do
            (cd "$dir" && npm audit --json 2>/dev/null || true) | node -e '
              let raw = ""; process.stdin.on("data", (c) => raw += c).on("end", () => {
                const report = JSON.parse(raw || "{}"); const vulns = report.vulnerabilities || {};
                for (const [name, v] of Object.entries(vulns)) {
                  const via = (v.via || []).filter((x) => typeof x === "object").map((x) => x.title).join("; ");
                  console.log(`::warning title=${process.argv[1]} advisory::${v.severity} ${name} ${v.range} fix=${JSON.stringify(v.fixAvailable)} ${via}`);
                }
                console.log(`${process.argv[1]}: ${Object.keys(vulns).length} advisories`);
              });' "$dir"
          done

      - name: Validate AWS bootstrap shell
        run: bash -n scripts/bootstrap-parent-aws.sh

      - name: Install agent runtime dependencies
        working-directory: services/foundation-agents
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate agent graph structure
        working-directory: services/foundation-agents
        run: npm run smoke

      - name: Audit agent runtime dependencies
        working-directory: services/foundation-agents
        run: bash ../../scripts/audit-npm-production.sh

      - name: Validate agent deployment shell
        run: |
          bash -n services/foundation-agents/scripts/deploy-control-plane.sh
          bash -n services/foundation-agents/scripts/deploy-public-guidance.sh

      - name: Test restricted deployment and rollback
        run: python3 services/foundation-agents/scripts/deploy-public-guidance-smoke.py

      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].sort.each { |f| YAML.load_file(f); puts f }"
