name: Foundation site and agents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Block vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

      - name: Install parent site dependencies
        run: npm ci

      - name: Build parent site
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites

      - name: Validate AWS CloudFront release contract
        run: npm run test:aws

      - name: Audit production dependencies
        run: bash scripts/audit-npm-production.sh

      - name: Validate AWS bootstrap shell
        run: bash -n scripts/bootstrap-parent-aws.sh

      - name: Install agent runtime dependencies
        working-directory: services/foundation-agents
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate agent graph structure
        working-directory: services/foundation-agents
        run: npm run smoke

      - name: Audit agent runtime dependencies
        working-directory: services/foundation-agents
        run: bash ../../scripts/audit-npm-production.sh

      - name: Validate agent deployment shell
        run: bash -n services/foundation-agents/scripts/deploy-control-plane.sh

      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].sort.each { |f| YAML.load_file(f); puts f }"
