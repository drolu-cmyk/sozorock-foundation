name: Foundation site and agents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install parent site dependencies
        run: npm ci

      - name: Build parent site
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites

      - name: Validate AWS CloudFront release contract
        run: npm run test:aws

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate AWS bootstrap shell
        run: bash -n scripts/bootstrap-parent-aws.sh

      - name: Install agent runtime dependencies
        working-directory: services/foundation-agents
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate agent graph structure
        working-directory: services/foundation-agents
        run: npm run smoke

      - name: Validate agent deployment shell
        run: bash -n services/foundation-agents/scripts/deploy-control-plane.sh

      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].sort.each { |f| YAML.load_file(f); puts f }"
