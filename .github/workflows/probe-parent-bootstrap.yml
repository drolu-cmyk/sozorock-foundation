name: Probe parent AWS bootstrap path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-parent-bootstrap.yml

permissions:
  id-token: write
  contents: write

jobs:
  probe:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Probe historical AI Lab deployment role
        id: bootstrap
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole
          role-session-name: SozoRockFoundationBootstrapProbe-${{ github.run_id }}
          aws-region: us-east-1
          retry-max-attempts: 2

      - name: Read dedicated Foundation role state
        id: inspect
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json > /tmp/caller.json
          aws iam get-role --role-name GitHubActionsSozorockFoundationDnsRole --output json > /tmp/foundation-role.json
          jq -c '.Role.AssumeRolePolicyDocument' /tmp/foundation-role.json > /tmp/foundation-trust.json

      - name: Record probe result
        if: always()
        shell: bash
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          set -euo pipefail
          mkdir -p deployments
          caller='null'
          trust='null'
          [[ -f /tmp/caller.json ]] && caller="$(cat /tmp/caller.json)"
          [[ -f /tmp/foundation-trust.json ]] && trust="$(cat /tmp/foundation-trust.json)"
          jq -n \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg bootstrap_outcome "$BOOTSTRAP_OUTCOME" \
            --arg inspect_outcome "$INSPECT_OUTCOME" \
            --argjson caller "$caller" \
            --argjson foundation_trust "$trust" \
            '{completed_at:$completed_at, workflow_run_id:$workflow_run_id, bootstrap_outcome:$bootstrap_outcome, inspect_outcome:$inspect_outcome, caller:$caller, foundation_trust:$foundation_trust, mutation_performed:false}' \
            > deployments/aws-bootstrap-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deployments/aws-bootstrap-probe.json
          git commit -m 'chore(www): record AWS bootstrap probe'
          git push origin HEAD:main
