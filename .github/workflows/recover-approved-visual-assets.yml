name: Recover approved Foundation visual assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  recover:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-foundation' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'recover-approved-visual-assets'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/restore-approved-visual-assets
      OLD_SITES_ORIGIN: https://sozorock-foundation.the-sozorock-4854.chatgpt.site
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover original visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/leadership

          valid_image() {
            local file="$1"
            [ -s "$file" ] || return 1
            [ "$(wc -c < "$file")" -gt 2500 ] || return 1
            case "$(file -b --mime-type "$file")" in
              image/jpeg|image/png|image/webp) return 0 ;;
              *) return 1 ;;
            esac
          }

          fetch_first_valid() {
            local destination="$1"; shift
            local url tmp
            tmp="${destination}.tmp"
            rm -f "$destination" "$tmp"
            for url in "$@"; do
              echo "Trying $url"
              if curl -fL --retry 2 --connect-timeout 15 --max-time 45 \
                   -A 'SozoRockFoundationAssetRecovery/1.0' "$url" -o "$tmp"; then
                if valid_image "$tmp"; then
                  mv "$tmp" "$destination"
                  echo "Recovered $destination from $url"
                  return 0
                fi
              fi
              rm -f "$tmp"
            done
            return 1
          }

          wayback_image() {
            local original="$1" destination="$2" encoded timestamp archived
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$original")"
            timestamp="$(curl -fsSL --retry 2 --max-time 45 \
              "https://web.archive.org/cdx/search/cdx?url=${encoded}&output=json&filter=statuscode:200&filter=mimetype:image%2F.*&fl=timestamp&collapse=digest&from=2025&to=2026&limit=1" \
              | jq -r 'if length > 1 then .[1][0] else empty end' || true)"
            [ -n "$timestamp" ] || return 1
            archived="https://web.archive.org/web/${timestamp}id_/${original}"
            fetch_first_valid "$destination" "$archived"
          }

          # Approved team-image mapping recorded by the recovered prototype:
          # m1 Nike Oye, m2 Anthony Abraham, m3 Jordan Hare, m4 Dr. Oluwabiyi Adeyemo.
          declare -A people=(
            [m1]='site/assets/leadership/nike-oye.png'
            [m2]='site/assets/leadership/anthony-abraham.png'
            [m3]='site/assets/leadership/jordan-hare.png'
            [m4]='site/assets/leadership/oluwabiyi-adeyemo.png'
          )

          for key in m1 m2 m3 m4; do
            destination="${people[$key]}"
            if fetch_first_valid "$destination" \
              "${OLD_SITES_ORIGIN}/${key}.png" \
              "${OLD_SITES_ORIGIN}/${key}.jpg" \
              "${OLD_SITES_ORIGIN}/${key}.webp"; then
              continue
            fi
            if wayback_image "https://www.sozorockfoundation.org/${key}.png" "$destination"; then
              continue
            fi
            if wayback_image "https://sozorockfoundation.org/${key}.png" "$destination"; then
              continue
            fi
            echo "FAILED to recover approved leadership source ${key}" >&2
            exit 1
          done

          recover_cover_from_meta() {
            local destination="$1"; shift
            local page html image
            for page in "$@"; do
              echo "Scraping cover metadata from $page"
              html="$(curl -fLsS --retry 2 --connect-timeout 15 --max-time 45 \
                -A 'Mozilla/5.0 (compatible; SozoRockFoundation/1.0)' "$page" || true)"
              [ -n "$html" ] || continue
              image="$(printf '%s' "$html" | python3 -c '
import html,re,sys
s=sys.stdin.read()
patterns=[
 r"<meta[^>]+property=[\"\x27]og:image[\"\x27][^>]+content=[\"\x27]([^\"\x27]+)",
 r"<meta[^>]+content=[\"\x27]([^\"\x27]+)[\"\x27][^>]+property=[\"\x27]og:image[\"\x27]",
 r"<meta[^>]+name=[\"\x27]twitter:image[\"\x27][^>]+content=[\"\x27]([^\"\x27]+)"
]
for p in patterns:
 m=re.search(p,s,re.I)
 if m:
  print(html.unescape(m.group(1))); break
')"
              [ -n "$image" ] || continue
              if fetch_first_valid "$destination" "$image"; then return 0; fi
            done
            return 1
          }

          # Use catalog/retailer cover services only to recover the actual publisher-supplied covers.
          if ! fetch_first_valid site/assets/rebs-cover.jpg \
              'https://covers.openlibrary.org/b/isbn/9798993647708-L.jpg?default=false'; then
            recover_cover_from_meta site/assets/rebs-cover.jpg \
              'https://tertulia.com/book/rural-equity-blueprint-series---volume-1-access-day-building-a-framework-for-rural-health-equity-in-new-york-state-oluwabiyi-adeyemo/9798993647708' \
              'https://bookscape.com/product-details/rural-equity-blueprint-series-volume-1-9798993647708' \
              'https://www.walmart.com/ip/18900605633'
          fi

          if ! fetch_first_valid site/assets/rrg-cover.jpg \
              'https://covers.openlibrary.org/b/isbn/9798993647715-L.jpg?default=false'; then
            recover_cover_from_meta site/assets/rrg-cover.jpg \
              'https://www.thenile.com.au/books/oluwabiyi-adeyemo/rethinking-rural-governance/9798993647715' \
              'https://bookscape.com/product-details/rethinking-rural-governance-9798993647715' \
              'https://business.walmart.com/ip/18836574208'
          fi

          for required in \
            site/assets/rebs-cover.jpg \
            site/assets/rrg-cover.jpg \
            site/assets/leadership/nike-oye.png \
            site/assets/leadership/anthony-abraham.png \
            site/assets/leadership/jordan-hare.png \
            site/assets/leadership/oluwabiyi-adeyemo.png; do
            valid_image "$required" || { echo "Missing or invalid $required" >&2; exit 1; }
            file "$required"
            wc -c "$required"
          done

      - name: Commit recovered binaries to repair branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$TARGET_BRANCH"
          git add site/assets/rebs-cover.jpg site/assets/rrg-cover.jpg site/assets/leadership/
          git commit -m 'fix(assets): restore approved publication covers and leadership portraits'
          git push --force-with-lease origin "$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish recovery receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Approved visual asset recovery: **SUCCESS**\n\nBranch: \`${TARGET_BRANCH}\`\nAsset commit: \`${SHA}\`\n\nRecovered and bundled the four approved leadership images plus the RRG and REBS publication covers. No production DNS or application resources were changed by this recovery job."
