name: Parent deployment trigger canary

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-foundation' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'deploy-parent-site'
    runs-on: ubuntu-latest
    steps:
      - name: Report accepted trigger
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue comment 15 --repo "$REPOSITORY" --body "Parent deployment trigger canary: **ACCEPTED**\n\nRun: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
