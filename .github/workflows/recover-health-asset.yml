name: Recover approved Health asset

on:
  push:
    branches:
      - parent-site-migration
    paths:
      - .github/workflows/recover-health-asset.yml

permissions:
  contents: write

jobs:
  recover-health-asset:
    if: github.repository == 'drolu-cmyk/sozorock-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: parent-site-migration
          fetch-depth: 0

      - name: Recover and verify approved SozoRock Health hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          curl -fsSL \
            'https://raw.githubusercontent.com/drolu-cmyk/sozorock-health/3f7bfb57f98b6d1ac5b3f5466153d0f9be5ef4a4/apps/public-site/public/media/approved-home/hero-community-desktop-v2.webp' \
            -o site/assets/health-community.webp

          test "$(wc -c < site/assets/health-community.webp)" -eq 73222
          actual_blob="$(git hash-object site/assets/health-community.webp)"
          test "$actual_blob" = 'd1f56687d982e40209d1e01e97fb0f5d9cb0ce68'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/assets/health-community.webp

          if git diff --cached --quiet; then
            echo 'Verified asset is already present.'
            exit 0
          fi

          git commit -m 'assets(site): recover approved SozoRock Health hero'
          git push origin HEAD:parent-site-migration
