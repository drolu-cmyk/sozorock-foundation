name: Deploy SozoRock Foundation parent site

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - scripts/build.mjs
      - scripts/qa.mjs
      - scripts/deploy-parent-regional.sh
      - package.json
      - .github/workflows/deploy-parent-site.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sozorock-foundation-parent-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
      ACCOUNT_ID: '791860731989'
      DOMAIN_NAME: www.sozorockfoundation.org
      WWW_NAME: www.sozorockfoundation.org.
      HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
      BUCKET_NAME: sozorock-foundation-parent-prod-791860731989
      CERTIFICATE_ARN: arn:aws:acm:us-east-1:791860731989:certificate/d2b11522-63cb-4c7f-b5a8-c0c25a39a2f7
      LAMBDA_ROLE_ARN: arn:aws:iam::791860731989:role/SozoRockFoundationParentLambdaRole

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate all parent routes
        run: |
          set -euo pipefail
          npm run build
          npm test

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationSiteDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 10

      - name: Provision, publish, cut over, and verify production
        shell: bash
        run: |
          set -euo pipefail

          # Keep the established regional deployment path while applying the
          # production redirect and readiness behavior before the deployment
          # script packages its Lambda origin.
          sed -i 's/<<<"${DOMAIN_JSON:-{}}"/<<<"${DOMAIN_JSON:-}"/' scripts/deploy-parent-regional.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/deploy-parent-regional.sh')
          text = path.read_text()

          handler_old = '''def handler(event, context):
              key = resolve_key(event.get('rawPath') or event.get('path') or '/')
          '''
          handler_new = '''REDIRECTS = {
              '/work/health': 'https://health.sozorockfoundation.org/',
              '/work/health/': 'https://health.sozorockfoundation.org/',
              '/work/ai-lab': 'https://ai-lab.sozorockfoundation.org/',
              '/work/ai-lab/': 'https://ai-lab.sozorockfoundation.org/',
          }


          def handler(event, context):
              raw_path = event.get('rawPath') or event.get('path') or '/'
              if raw_path in REDIRECTS:
                  return {
                      'statusCode': 301,
                      'headers': {
                          **SECURITY_HEADERS,
                          'location': REDIRECTS[raw_path],
                          'cache-control': 'public,max-age=300',
                      },
                      'body': '',
                      'isBase64Encoded': False,
                  }
              key = resolve_key(raw_path)
          '''
          if handler_old not in text:
              raise SystemExit('Expected Lambda handler block not found')
          text = text.replace(handler_old, handler_new)

          probe_old = '''log "Verify custom-domain target directly before Route 53 cutover"
          TARGET_IP="$(getent ahostsv4 "$TARGET" | awk 'NR==1{print $1}')"
          test -n "$TARGET_IP"
          custom_page="$(curl -fsSL --max-time 30 --resolve "${DOMAIN_NAME}:443:${TARGET_IP}" "https://${DOMAIN_NAME}/?target=${RUN_ID}")"
          grep -Fq 'Access.' <<<"$custom_page"
          grep -Fq 'Assurance.' <<<"$custom_page"
          grep -Fq 'Intelligence.' <<<"$custom_page"
          '''
          probe_new = '''log "Wait for custom-domain API mapping before Route 53 cutover"
          CUSTOM_DOMAIN_READY=0
          for _ in $(seq 1 90); do
            TARGET_IP="$(getent ahostsv4 "$TARGET" | awk 'NR==1{print $1}' || true)"
            if [ -n "$TARGET_IP" ]; then
              custom_page="$(curl -fsSL --max-time 20 --resolve "${DOMAIN_NAME}:443:${TARGET_IP}" "https://${DOMAIN_NAME}/?target=${RUN_ID}" || true)"
              if grep -Fq 'Access.' <<<"$custom_page" && grep -Fq 'Assurance.' <<<"$custom_page" && grep -Fq 'Intelligence.' <<<"$custom_page"; then
                CUSTOM_DOMAIN_READY=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$CUSTOM_DOMAIN_READY" != "1" ]; then
            echo "API Gateway custom-domain mapping did not become ready; www remains unchanged." >&2
            exit 1
          fi
          '''
          if probe_old not in text:
              raise SystemExit('Expected custom-domain verification block not found')
          text = text.replace(probe_old, probe_new)
          path.write_text(text)
          PY

          bash scripts/deploy-parent-regional.sh

          verify_redirect() {
            local source="$1" expected="$2" headers status location
            headers="$(curl -sS --max-time 20 -D - -o /dev/null "https://${DOMAIN_NAME}${source}")"
            status="$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' | tr -d '\r')"
            location="$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}')"
            test "$status" = '301'
            test "$location" = "$expected"
          }

          verify_redirect '/work/health' 'https://health.sozorockfoundation.org/'
          verify_redirect '/work/ai-lab' 'https://ai-lab.sozorockfoundation.org/'

          curl -fsSL --max-time 20 "https://${DOMAIN_NAME}/sitemap.xml" | grep -Fq 'https://www.sozorockfoundation.org/publications'
          curl -fsSL --max-time 20 "https://${DOMAIN_NAME}/leadership" | grep -Fq '/assets/leadership/oluwabiyi-adeyemo.png'
          curl -fsSL --max-time 20 "https://${DOMAIN_NAME}/publications" | grep -Fq '/assets/rrg-cover.jpg'
