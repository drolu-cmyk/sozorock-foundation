name: Deploy Foundation agent control plane

on:
  push:
    branches: [main]
    paths:
      - services/foundation-agents/**
      - .github/workflows/deploy-foundation-agent-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: foundation-agent-control-plane
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  FUNCTION_NAME: SozoRockFoundationParentOrigin
  API_NAME: SozoRockFoundationParentSite
  RECEIPT_ISSUE: '58'

jobs:
  deploy:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate agent runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run smoke

      - name: Package Lambda runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts
          rm -f "$RUNNER_TEMP/foundation-agents.zip"
          zip -qr "$RUNNER_TEMP/foundation-agents.zip" src node_modules package.json
          size="$(stat -c '%s' "$RUNNER_TEMP/foundation-agents.zip")"
          test "$size" -lt 52428800
          echo "LAMBDA_ZIP=$RUNNER_TEMP/foundation-agents.zip" >> "$GITHUB_ENV"
          echo "Lambda package bytes: ${size}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure trusted Foundation AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationAgents-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Record deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent control-plane deployment **started** for commit \`${GITHUB_SHA}\` (run \`${GITHUB_RUN_ID}\`). No production completion is claimed until IAM-route, Lambda, and model smoke checks finish."

      - name: Deploy combined redirect and private agent Lambda
        id: deploy
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE || 'https://api.openai.com/v1' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"

          function_json="$(aws lambda get-function --function-name "$FUNCTION_NAME" --output json)"
          function_arn="$(jq -r '.Configuration.FunctionArn' <<<"$function_json")"
          execution_role="$(jq -r '.Configuration.Role' <<<"$function_json")"
          test "$function_arn" = "arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:${FUNCTION_NAME}"
          test "$execution_role" = "arn:aws:iam::${ACCOUNT_ID}:role/SozoRockFoundationParentLambdaRole"

          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$API_NAME" '.Items[]? | select(.Name == $name) | .ApiId' | head -n1)"
          test -n "$api_id"
          api_endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query ApiEndpoint --output text)"
          test -n "$api_endpoint"

          jq -n \
            --arg model 'gpt-5.6-sol' \
            --arg region "$AWS_REGION" \
            --arg key "$OPENAI_API_KEY" \
            --arg provider "$OPENAI_IDENTITY_PROVIDER_ID" \
            --arg service "$OPENAI_SERVICE_ACCOUNT_ID" \
            --arg audience "$OPENAI_WIF_AUDIENCE" \
            '{Variables:{OPENAI_AGENT_MODEL:$model,AWS_REGION:$region,OPENAI_API_KEY:$key,OPENAI_IDENTITY_PROVIDER_ID:$provider,OPENAI_SERVICE_ACCOUNT_ID:$service,OPENAI_WIF_AUDIENCE:$audience}} | .Variables |= with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/lambda-env.json"

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$LAMBDA_ZIP" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime nodejs22.x \
            --handler src/handler.handler \
            --memory-size 1024 \
            --timeout 120 \
            --environment "file://$RUNNER_TEMP/lambda-env.json" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          integrations="$(aws apigatewayv2 get-integrations --api-id "$api_id" --output json)"
          integration_id="$(jq -r --arg arn "$function_arn" '.Items[]? | select(.IntegrationType == "AWS_PROXY" and .IntegrationUri == $arn) | .IntegrationId' <<<"$integrations" | head -n1)"
          if [[ -z "$integration_id" ]]; then
            integration_id="$(aws apigatewayv2 create-integration \
              --api-id "$api_id" \
              --integration-type AWS_PROXY \
              --integration-uri "$function_arn" \
              --payload-format-version '2.0' \
              --query IntegrationId \
              --output text)"
          fi
          test -n "$integration_id"

          routes="$(aws apigatewayv2 get-routes --api-id "$api_id" --output json)"
          upsert_route() {
            route_key="$1"
            route_id="$(jq -r --arg key "$route_key" '.Items[]? | select(.RouteKey == $key) | .RouteId' <<<"$routes" | head -n1)"
            if [[ -n "$route_id" ]]; then
              aws apigatewayv2 update-route \
                --api-id "$api_id" \
                --route-id "$route_id" \
                --authorization-type AWS_IAM \
                --target "integrations/${integration_id}" >/dev/null
            else
              aws apigatewayv2 create-route \
                --api-id "$api_id" \
                --route-key "$route_key" \
                --authorization-type AWS_IAM \
                --target "integrations/${integration_id}" >/dev/null
            fi
          }
          upsert_route 'GET /internal/health'
          upsert_route 'GET /internal/v1/graphs'
          upsert_route 'POST /internal/v1/run'

          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FoundationAgentsInternalApiInvoke >/dev/null 2>&1 || true
          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FoundationAgentsInternalApiInvoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${api_id}/*/*/internal/*" >/dev/null

          routes_after="$(aws apigatewayv2 get-routes --api-id "$api_id" --output json)"
          for key in 'GET /internal/health' 'GET /internal/v1/graphs' 'POST /internal/v1/run'; do
            auth="$(jq -r --arg key "$key" '.Items[]? | select(.RouteKey == $key) | .AuthorizationType' <<<"$routes_after")"
            target="$(jq -r --arg key "$key" '.Items[]? | select(.RouteKey == $key) | .Target' <<<"$routes_after")"
            test "$auth" = 'AWS_IAM'
            test "$target" = "integrations/${integration_id}"
          done

          cat > "$RUNNER_TEMP/public-event.json" <<'JSON'
          {"version":"2.0","rawPath":"/publication/rrg-v1-2025","rawQueryString":"source=agent-edge","requestContext":{"http":{"method":"GET","path":"/publication/rrg-v1-2025"}}}
          JSON
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload "file://$RUNNER_TEMP/public-event.json" \
            "$RUNNER_TEMP/public-response.json" >/dev/null
          test "$(jq -r '.statusCode' "$RUNNER_TEMP/public-response.json")" = '308'
          test "$(jq -r '.headers.location' "$RUNNER_TEMP/public-response.json")" = 'https://www.sozorockfoundation.org/publication/rrg-v1-2025?source=agent-edge'

          cat > "$RUNNER_TEMP/health-event.json" <<'JSON'
          {"version":"2.0","rawPath":"/internal/health","requestContext":{"http":{"method":"GET","path":"/internal/health"}}}
          JSON
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload "file://$RUNNER_TEMP/health-event.json" \
            "$RUNNER_TEMP/health-response.json" >/dev/null
          test "$(jq -r '.statusCode' "$RUNNER_TEMP/health-response.json")" = '200'
          health_body="$(jq -r '.body' "$RUNNER_TEMP/health-response.json")"
          test "$(jq -r '.ok' <<<"$health_body")" = 'true'
          auth_mode="$(jq -r '.modelAuthMode // "none"' <<<"$health_body")"
          model_configured="$(jq -r '.modelConfigured' <<<"$health_body")"

          unauth_status="$(curl --silent --show-error --output /dev/null --max-time 20 --write-out '%{http_code}' "${api_endpoint}/internal/health" || true)"
          test "$unauth_status" = '403'

          echo "api_id=$api_id" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$api_endpoint" >> "$GITHUB_OUTPUT"
          echo "auth_mode=$auth_mode" >> "$GITHUB_OUTPUT"
          echo "model_configured=$model_configured" >> "$GITHUB_OUTPUT"

          if [[ "$model_configured" = 'true' ]]; then
            cat > "$RUNNER_TEMP/run-event.json" <<'JSON'
          {"version":"2.0","rawPath":"/internal/v1/run","requestContext":{"http":{"method":"POST","path":"/internal/v1/run"}},"body":"{\"graphId\":\"foundationSiteAssurance\",\"input\":{\"task\":\"Review a bounded synthetic deployment change.\",\"evidence\":{\"repository\":\"sozorock-foundation\",\"liveVerification\":\"not supplied\",\"constraint\":\"Do not claim production completion without live evidence.\"}},\"context\":{\"source\":\"deployment-smoke\"}}"}
          JSON
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out \
              --payload "file://$RUNNER_TEMP/run-event.json" \
              "$RUNNER_TEMP/run-response.json" >/dev/null
            test "$(jq -r '.statusCode' "$RUNNER_TEMP/run-response.json")" = '200'
            run_body="$(jq -r '.body' "$RUNNER_TEMP/run-response.json")"
            terminal_status="$(jq -r '.status' <<<"$run_body")"
            decision="$(jq -r '.decision' <<<"$run_body")"
            run_id="$(jq -r '.runId' <<<"$run_body")"
            [[ "$terminal_status" = 'review_required' || "$terminal_status" = 'escalated' ]]
            [[ "$decision" = 'pass' || "$decision" = 'revise' || "$decision" = 'escalate' ]]
            test -n "$run_id"
            echo "graph_status=$terminal_status" >> "$GITHUB_OUTPUT"
            echo "graph_decision=$decision" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          outcome='${{ steps.deploy.outcome }}'
          configured='${{ steps.deploy.outputs.model_configured }}'
          auth_mode='${{ steps.deploy.outputs.auth_mode }}'
          graph_status='${{ steps.deploy.outputs.graph_status }}'
          graph_decision='${{ steps.deploy.outputs.graph_decision }}'
          body="Agent control-plane run \`${GITHUB_RUN_ID}\`: deployment **${outcome}**. Internal API routes are configured with AWS IAM when deployment succeeds. Model configured: **${configured:-unknown}**; auth mode: \`${auth_mode:-none}\`; graph smoke status: \`${graph_status:-not-run}\`; decision: \`${graph_decision:-not-run}\`. No secret values are included in this receipt."
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Require fully operational control plane
        if: always()
        shell: bash
        run: |
          test "${{ steps.deploy.outcome }}" = 'success'
          test "${{ steps.deploy.outputs.model_configured }}" = 'true'
          status='${{ steps.deploy.outputs.graph_status }}'
          [[ "$status" = 'review_required' || "$status" = 'escalated' ]]
