name: Deploy Foundation agent control plane

on:
  push:
    branches: [main]
    paths:
      - scripts/check-tracked-secrets.py
      - scripts/audit-npm-production.sh
      - services/foundation-agents/**
      - .github/workflows/deploy-foundation-agent-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-agent-control-plane
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  FUNCTION_NAME: SozoRockFoundationParentOrigin
  API_NAME: SozoRockFoundationParentSite
  FOUNDATION_MODEL_EXECUTION_ENABLED: 'false'

jobs:
  deploy:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check committed source
        run: python3 scripts/check-tracked-secrets.py --self-test

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install and validate agent runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run smoke
          bash ../../scripts/audit-npm-production.sh

      - name: Package Lambda runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          rm -f "$RUNNER_TEMP/foundation-agents.zip"
          zip -qr "$RUNNER_TEMP/foundation-agents.zip" src node_modules package.json
          size="$(stat -c '%s' "$RUNNER_TEMP/foundation-agents.zip")"
          test "$size" -lt 52428800
          echo "LAMBDA_ZIP=$RUNNER_TEMP/foundation-agents.zip" >> "$GITHUB_ENV"
          echo "Lambda package bytes: ${size}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure trusted Foundation AWS role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationAgents-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Deploy combined redirect and private Bedrock agent control plane
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_WIF_AUDIENCE || true
          if [[ "$FOUNDATION_MODEL_EXECUTION_ENABLED" == 'true' ]]; then
            bash services/foundation-agents/scripts/deploy-control-plane.sh
          else
            bash services/foundation-agents/scripts/deploy-public-guidance.sh
          fi

      - name: Publish deployment receipt
        if: always() && env.FOUNDATION_MODEL_EXECUTION_ENABLED == 'true'
        shell: bash
        run: |
          outcome='${{ steps.deploy.outcome }}'
          configured='${{ steps.deploy.outputs.model_configured }}'
          auth_mode='${{ steps.deploy.outputs.auth_mode }}'
          api_mode='${{ steps.deploy.outputs.model_api_mode }}'
          selected_model='${{ steps.deploy.outputs.selected_model }}'
          signed_route='${{ steps.deploy.outputs.signed_route_verified }}'
          graph_status='${{ steps.deploy.outputs.graph_status }}'
          graph_decision='${{ steps.deploy.outputs.graph_decision }}'
          body="Agent control-plane run \`${GITHUB_RUN_ID}\`: secure infrastructure deployment **${outcome}**. Canonical redirect and unsigned 403 protection are required before infrastructure remains deployed. Model configured: **${configured:-unknown}**; selected model: \`${selected_model:-unknown}\`; auth mode: \`${auth_mode:-none}\`; model API: \`${api_mode:-unknown}\`; deploy-role signed internal route: \`${signed_route:-not-run}\`; authenticated parallel six-agent canary status: \`${graph_status:-not-run}\`; decision: \`${graph_decision:-not-run}\`. No secret values are included in this receipt."
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Require secure Bedrock infrastructure and a real six-agent canary
        if: always() && env.FOUNDATION_MODEL_EXECUTION_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.deploy.outcome }}" = 'success'
          test "${{ steps.deploy.outputs.signed_route_verified }}" = 'true'
          test "${{ steps.deploy.outputs.model_configured }}" = 'true'
          test "${{ steps.deploy.outputs.auth_mode }}" = 'bedrock_short_term'
          selected_model='${{ steps.deploy.outputs.selected_model }}'
          model_api_mode='${{ steps.deploy.outputs.model_api_mode }}'
          [[ "$selected_model" = 'openai.gpt-5.6-sol' || "$selected_model" = 'us.anthropic.claude-sonnet-4-6' || "$selected_model" = 'openai.gpt-oss-120b' || "$selected_model" = 'openai.gpt-oss-20b' ]]
          if [[ "$selected_model" = 'openai.gpt-5.6-sol' ]]; then
            test "$model_api_mode" = 'responses'
          else
            test "$model_api_mode" = 'chat_completions'
          fi
          status='${{ steps.deploy.outputs.graph_status }}'
          decision='${{ steps.deploy.outputs.graph_decision }}'
          [[ "$status" = 'review_required' || "$status" = 'escalated' ]]
          [[ "$decision" = 'pass' || "$decision" = 'revise' || "$decision" = 'escalate' ]]

      - name: Verify public guidance with model execution paused
        if: always() && env.FOUNDATION_MODEL_EXECUTION_ENABLED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.deploy.outcome }}" = 'success'
          test "${{ steps.deploy.outputs.public_guidance_verified }}" = 'true'
          test "${{ steps.deploy.outputs.model_execution_paused }}" = 'true'
          printf 'Approved public guidance is deployed. Model execution is paused. Redirects and private-route authentication passed.\n' >> "$GITHUB_STEP_SUMMARY"
