name: Deploy Foundation agent control plane

on:
  push:
    branches: [main]
    paths:
      - services/foundation-agents/**
      - .github/workflows/deploy-foundation-agent-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: foundation-agent-control-plane
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  ACCOUNT_ID: '791860731989'
  FUNCTION_NAME: SozoRockFoundationParentOrigin
  API_NAME: SozoRockFoundationParentSite
  RECEIPT_ISSUE: '58'

jobs:
  deploy:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install and validate agent runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run smoke

      - name: Package Lambda runtime
        working-directory: services/foundation-agents
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts
          rm -f "$RUNNER_TEMP/foundation-agents.zip"
          zip -qr "$RUNNER_TEMP/foundation-agents.zip" src node_modules package.json
          size="$(stat -c '%s' "$RUNNER_TEMP/foundation-agents.zip")"
          test "$size" -lt 52428800
          echo "LAMBDA_ZIP=$RUNNER_TEMP/foundation-agents.zip" >> "$GITHUB_ENV"
          echo "Lambda package bytes: ${size}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure trusted Foundation AWS role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationAgents-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Record deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Agent control-plane deployment **started** for commit \`${GITHUB_SHA}\` (run \`${GITHUB_RUN_ID}\`). Production accepts only short-term Bedrock model authentication; completion requires a signed real graph smoke."

      - name: Deploy combined redirect and private Bedrock agent control plane
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_WIF_AUDIENCE || true
          bash services/foundation-agents/scripts/deploy-control-plane.sh

      - name: Publish deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          outcome='${{ steps.deploy.outcome }}'
          configured='${{ steps.deploy.outputs.model_configured }}'
          auth_mode='${{ steps.deploy.outputs.auth_mode }}'
          signed_route='${{ steps.deploy.outputs.signed_route_verified }}'
          graph_status='${{ steps.deploy.outputs.graph_status }}'
          graph_decision='${{ steps.deploy.outputs.graph_decision }}'
          body="Agent control-plane run \`${GITHUB_RUN_ID}\`: secure infrastructure deployment **${outcome}**. Canonical redirect and unsigned 403 protection are required before infrastructure remains deployed. Model configured: **${configured:-unknown}**; auth mode: \`${auth_mode:-none}\`; deploy-role signed internal probe: \`${signed_route:-not-run}\`; graph smoke status: \`${graph_status:-not-run}\`; decision: \`${graph_decision:-not-run}\`. No secret values are included in this receipt."
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Require secure Bedrock infrastructure and a real signed graph smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.deploy.outcome }}" = 'success'
          test "${{ steps.deploy.outputs.signed_route_verified }}" = 'true'
          test "${{ steps.deploy.outputs.model_configured }}" = 'true'
          test "${{ steps.deploy.outputs.auth_mode }}" = 'bedrock_short_term'
          status='${{ steps.deploy.outputs.graph_status }}'
          decision='${{ steps.deploy.outputs.graph_decision }}'
          [[ "$status" = 'review_required' || "$status" = 'escalated' ]]
          [[ "$decision" = 'pass' || "$decision" = 'revise' || "$decision" = 'escalate' ]]

      - name: Close activation receipt after verified GPT-5.6 Sol activation
        if: success() && steps.deploy.outputs.signed_route_verified == 'true' && steps.deploy.outputs.model_configured == 'true' && steps.deploy.outputs.auth_mode == 'bedrock_short_term' && (steps.deploy.outputs.graph_status == 'review_required' || steps.deploy.outputs.graph_status == 'escalated')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          graph_status='${{ steps.deploy.outputs.graph_status }}'
          graph_decision='${{ steps.deploy.outputs.graph_decision }}'
          cat > "$RUNNER_TEMP/activation-complete.md" <<EOF
          ## Foundation agent activation complete

          GPT-5.6 Sol is active through short-term Amazon Bedrock credentials on the private AWS-IAM-protected Foundation control plane. The production deployment passed canonical redirect verification, unsigned 403 protection, the signed internal route check, and a real model-backed bounded graph smoke ending in \`${graph_status}\` with decision \`${graph_decision}\`.

          No long-lived model credential is stored in the Foundation runtime.
          EOF
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/activation-complete.md"
          gh issue close "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
