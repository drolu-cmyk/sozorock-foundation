name: Deploy parent website to AWS CloudFront

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - scripts/prepare-sites-build.mjs
      - scripts/bootstrap-parent-aws.sh
      - scripts/validate-aws-release.mjs
      - infra/cloudformation/parent-cloudfront.yml
      - services/foundation-agents/**
      - .github/workflows/deploy-parent-cloudfront.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: sozorock-foundation-parent-cloudfront
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: '791860731989'
  BOOTSTRAP_ROLE_ARN: arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole
  DEPLOY_ROLE_ARN: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  EXECUTION_ROLE_ARN: arn:aws:iam::791860731989:role/SozoRockFoundationParentCloudFormationRole
  STACK_NAME: sozorock-foundation-parent-cloudfront
  BUCKET_NAME: sozorock-foundation-parent-cloudfront-prod-791860731989
  HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
  APEX_HOST: sozorockfoundation.org
  CANONICAL_HOST: www.sozorockfoundation.org
  AGENT_API_NAME: SozoRockFoundationParentSite
  CLOUDFRONT_ZONE_ID: Z2FDTNDATAQYW2
  RECEIPT_ISSUE: '15'

jobs:
  deploy:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Build and validate the approved site
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:sites
          npm run test:aws
          npm audit --omit=dev --audit-level=high
          bash -n scripts/bootstrap-parent-aws.sh

      - name: Assume the bounded bootstrap authority
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          role-session-name: FoundationCloudFrontBootstrap-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Establish narrow repeatable deployment authority
        run: bash scripts/bootstrap-parent-aws.sh

      - name: Switch to the Foundation deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: FoundationCloudFrontDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Resolve the Foundation navigator origin
        id: agent_api
        shell: bash
        run: |
          set -euo pipefail
          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$AGENT_API_NAME" '.Items[]? | select(.Name == $name) | .ApiId' | head -n1)"
          test -n "$api_id"
          api_endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query ApiEndpoint --output text)"
          agent_api_domain="${api_endpoint#https://}"
          test -n "$agent_api_domain"
          test "$agent_api_domain" != "$api_endpoint"
          echo "agent_api_domain=$agent_api_domain" >> "$GITHUB_OUTPUT"

      - name: Record protected mail DNS before deployment
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/cloudformation/parent-cloudfront.yml >/dev/null
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json \
            | jq -S '[.ResourceRecordSets[] | select(.Type == "MX" or .Type == "TXT")]' \
            > "$RUNNER_TEMP/mail-records-before.json"
          test "$(jq length "$RUNNER_TEMP/mail-records-before.json")" -ge 2

      - name: Resolve alias ownership and repeat-deployment mode
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          enable_aliases=false
          target_id=''
          target_domain=''
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            target_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)"
            target_domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' --output text)"
          fi

          web_records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json)"
          if [[ -n "$target_id" && -n "$target_domain" ]]; then
            aliases="$(aws cloudfront get-distribution --id "$target_id" --query 'Distribution.DistributionConfig.Aliases.Items' --output json)"
            if jq -e --arg apex "$APEX_HOST" --arg www "$CANONICAL_HOST" 'index($apex) and index($www)' <<<"$aliases" >/dev/null \
              && jq -e --arg apex "${APEX_HOST}." --arg www "${CANONICAL_HOST}." --arg target "${target_domain}." '
                [.ResourceRecordSets[] | select((.Name==$apex or .Name==$www) and (.Type=="A" or .Type=="AAAA"))] as $web |
                ($web | length) == 4 and all($web[]; .AliasTarget.DNSName == $target)
              ' <<<"$web_records" >/dev/null; then
              enable_aliases=true
            fi
          fi

          distributions="$(aws cloudfront list-distributions --output json)"
          apex_source_id="$(jq -r --arg alias "$APEX_HOST" '[.DistributionList.Items[]? | select((.Aliases.Items // []) | index($alias)) | .Id][0] // ""' <<<"$distributions")"
          www_source_id="$(jq -r --arg alias "$CANONICAL_HOST" '[.DistributionList.Items[]? | select((.Aliases.Items // []) | index($alias)) | .Id][0] // ""' <<<"$distributions")"
          if [[ "$enable_aliases" = false && -z "$apex_source_id" ]]; then
            echo "No in-account apex alias owner was found; DNS remains unchanged while CloudFront validates ownership during associate-alias."
          fi

          {
            echo "enable_aliases=$enable_aliases"
            echo "apex_source_id=$apex_source_id"
            echo "www_source_id=$www_source_id"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the AWS target without disrupting live aliases
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/cloudformation/parent-cloudfront.yml \
            --role-arn "$EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              ApexDomain="$APEX_HOST" \
              CanonicalDomain="$CANONICAL_HOST" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              SiteBucketName="$BUCKET_NAME" \
              AgentApiDomain='${{ steps.agent_api.outputs.agent_api_domain }}' \
              EnableAliases='${{ steps.release_state.outputs.enable_aliases }}' \
            --no-fail-on-empty-changeset

      - name: Publish the exact verified build to private S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/client/ "s3://${BUCKET_NAME}/" --delete --exclude 'assets/*' --cache-control 'public,max-age=300,must-revalidate'
          aws s3 sync dist/client/assets/ "s3://${BUCKET_NAME}/assets/" --delete --cache-control 'public,max-age=31536000,immutable'

      - name: Resolve and verify the isolated target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          distribution_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)"
          distribution_domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' --output text)"
          test -n "$distribution_id"
          test -n "$distribution_domain"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$distribution_domain" >> "$GITHUB_OUTPUT"
          aws cloudfront wait distribution-deployed --id "$distribution_id"
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*' >/dev/null
          for attempt in $(seq 1 30); do
            page="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 "https://${distribution_domain}/?preview=${GITHUB_RUN_ID}" || true)"
            if grep -Fq 'Access. Assurance. Intelligence.' <<<"$page"; then break; fi
            test "$attempt" -lt 30
            sleep 10
          done
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "https://${distribution_domain}/platforms" | grep -Fq '<title>Platforms | The SozoRock Foundation</title>'
          api_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/api-preflight.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{"email":"invalid"}' \
            "https://${distribution_domain}/api/contact")"
          test "$api_status" = '400'
          publication_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/publication-preflight.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{"email":"invalid"}' \
            "https://${distribution_domain}/api/publications/access/hsa-v1-2026")"
          test "$publication_status" = '400'
          navigator_status=''
          for attempt in $(seq 1 40); do
            navigator_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/navigator-preflight.json" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data '{"question":"x"}' \
              "https://${distribution_domain}/api/navigator")"
            [[ "$navigator_status" = '400' ]] && break
            test "$attempt" -lt 40
            sleep 15
          done
          test "$navigator_status" = '400'

      - name: Move and attach both production aliases after preflight
        if: steps.release_state.outputs.enable_aliases != 'true'
        shell: bash
        env:
          APEX_SOURCE_ID: ${{ steps.release_state.outputs.apex_source_id }}
          WWW_SOURCE_ID: ${{ steps.release_state.outputs.www_source_id }}
        run: |
          set -euo pipefail
          distribution_id='${{ steps.target.outputs.distribution_id }}'
          distribution_domain='${{ steps.target.outputs.distribution_domain }}'
          verification_before="$RUNNER_TEMP/alias-verification-before.json"
          moved=0
          complete=0

          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json)"
          jq --arg apex "_.${APEX_HOST}." --arg www "_${CANONICAL_HOST}." \
            '[.ResourceRecordSets[] | select((.Name==$apex or .Name==$www) and .Type=="TXT")]' \
            <<<"$records" > "$verification_before"

          jq -n \
            --arg apex "_.${APEX_HOST}." \
            --arg www "_${CANONICAL_HOST}." \
            --arg value "\"${distribution_domain}\"" \
            '{Comment:"Temporarily verify ownership for the Foundation CloudFront alias move",Changes:[
              {Action:"UPSERT",ResourceRecordSet:{Name:$apex,Type:"TXT",TTL:60,ResourceRecords:[{Value:$value}]}},
              {Action:"UPSERT",ResourceRecordSet:{Name:$www,Type:"TXT",TTL:60,ResourceRecords:[{Value:$value}]}}
            ]}' > "$RUNNER_TEMP/alias-verification-upsert.json"
          verification_change="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "file://$RUNNER_TEMP/alias-verification-upsert.json" \
            --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$verification_change"

          restore_verification_records() {
            current="$RUNNER_TEMP/alias-verification-current.json"
            restore="$RUNNER_TEMP/alias-verification-restore.json"
            aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json \
              | jq --arg apex "_.${APEX_HOST}." --arg www "_${CANONICAL_HOST}." \
                '[.ResourceRecordSets[] | select((.Name==$apex or .Name==$www) and .Type=="TXT")]' \
              > "$current"
            jq -n --slurpfile current "$current" --slurpfile old "$verification_before" '{
              Comment:"Restore Foundation DNS after CloudFront alias ownership verification",
              Changes:(($current[0] | map({Action:"DELETE",ResourceRecordSet:.})) + ($old[0] | map({Action:"CREATE",ResourceRecordSet:.})))
            }' > "$restore"
            if [[ "$(jq '.Changes | length' "$restore")" -gt 0 ]]; then
              restore_change="$(aws route53 change-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --change-batch "file://$restore" \
                --query ChangeInfo.Id --output text)"
              aws route53 wait resource-record-sets-changed --id "$restore_change"
            fi
          }

          rollback_aliases() {
            if [[ "$moved" = '1' && "$complete" != '1' ]]; then
              config="$RUNNER_TEMP/target-distribution-config.json"
              update="$RUNNER_TEMP/target-distribution-without-aliases.json"
              etag="$(aws cloudfront get-distribution-config --id "$distribution_id" --query ETag --output text)"
              aws cloudfront get-distribution-config --id "$distribution_id" --query DistributionConfig --output json > "$config"
              jq '.Aliases = {Quantity:0}' "$config" > "$update"
              aws cloudfront update-distribution --id "$distribution_id" --if-match "$etag" --distribution-config "file://$update" >/dev/null || true
              aws cloudfront wait distribution-deployed --id "$distribution_id" || true
              [[ -z "$APEX_SOURCE_ID" ]] || aws cloudfront associate-alias --alias "$APEX_HOST" --target-distribution-id "$APEX_SOURCE_ID" || true
              [[ -z "$WWW_SOURCE_ID" ]] || aws cloudfront associate-alias --alias "$CANONICAL_HOST" --target-distribution-id "$WWW_SOURCE_ID" || true
            fi
          }

          finish_alias_move() {
            status=$?
            trap - EXIT
            set +e
            rollback_aliases
            rollback_status=$?
            restore_verification_records
            restore_status=$?
            if [[ "$status" = '0' && "$rollback_status" != '0' ]]; then status="$rollback_status"; fi
            if [[ "$status" = '0' && "$restore_status" != '0' ]]; then status="$restore_status"; fi
            exit "$status"
          }
          trap finish_alias_move EXIT

          aws cloudfront associate-alias --alias "$APEX_HOST" --target-distribution-id "$distribution_id"
          moved=1
          aws cloudfront associate-alias --alias "$CANONICAL_HOST" --target-distribution-id "$distribution_id"
          aws cloudfront wait distribution-deployed --id "$distribution_id"
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/cloudformation/parent-cloudfront.yml \
            --role-arn "$EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              ApexDomain="$APEX_HOST" \
              CanonicalDomain="$CANONICAL_HOST" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              SiteBucketName="$BUCKET_NAME" \
              AgentApiDomain='${{ steps.agent_api.outputs.agent_api_domain }}' \
              EnableAliases=true \
            --no-fail-on-empty-changeset
          aws cloudfront wait distribution-deployed --id '${{ steps.target.outputs.distribution_id }}'
          target_ip="$(getent ahostsv4 '${{ steps.target.outputs.distribution_domain }}' | awk 'NR==1 {print $1}')"
          test -n "$target_ip"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --resolve "${CANONICAL_HOST}:443:${target_ip}" "https://${CANONICAL_HOST}/platforms" | grep -Fq 'Three platforms'
          headers="$(mktemp)"
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$headers" --output /dev/null --resolve "${APEX_HOST}:443:${target_ip}" --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=precutover")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print}' "$headers")"
          test "$status" = '308'
          test "$location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=precutover"
          complete=1
          touch "$RUNNER_TEMP/foundation-aliases-moved"

      - name: Verify production certificates before DNS
        if: steps.release_state.outputs.enable_aliases == 'true'
        shell: bash
        env:
          DISTRIBUTION_DOMAIN: ${{ steps.target.outputs.distribution_domain }}
        run: |
          set -euo pipefail
          target_ip="$(getent ahostsv4 "$DISTRIBUTION_DOMAIN" | awk 'NR==1 {print $1}')"
          test -n "$target_ip"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --resolve "${CANONICAL_HOST}:443:${target_ip}" "https://${CANONICAL_HOST}/platforms" | grep -Fq 'Three platforms'
          headers="$(mktemp)"
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$headers" --output /dev/null --resolve "${APEX_HOST}:443:${target_ip}" --write-out '%{http_code}' "https://${APEX_HOST}/publication/rrg-v1-2025?source=precutover")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print}' "$headers")"
          test "$status" = '308'
          test "$location" = "https://${CANONICAL_HOST}/publication/rrg-v1-2025?source=precutover"

      - name: Atomically cut over DNS with automatic rollback
        id: dns
        shell: bash
        env:
          DISTRIBUTION_DOMAIN: ${{ steps.target.outputs.distribution_domain }}
          DISTRIBUTION_ID: ${{ steps.target.outputs.distribution_id }}
          INITIAL_ENABLE_ALIASES: ${{ steps.release_state.outputs.enable_aliases }}
          APEX_SOURCE_ID: ${{ steps.release_state.outputs.apex_source_id }}
          WWW_SOURCE_ID: ${{ steps.release_state.outputs.www_source_id }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original-web-records.json"
          rollback="$RUNNER_TEMP/rollback-web-records.json"
          changed=0
          verified=0

          rollback_dns() {
            if [[ "$verified" != '1' ]]; then
              if [[ "$INITIAL_ENABLE_ALIASES" != 'true' && -f "$RUNNER_TEMP/foundation-aliases-moved" ]]; then
                aws cloudformation deploy \
                  --stack-name "$STACK_NAME" \
                  --template-file infra/cloudformation/parent-cloudfront.yml \
                  --role-arn "$EXECUTION_ROLE_ARN" \
                  --parameter-overrides \
                    ApexDomain="$APEX_HOST" \
                    CanonicalDomain="$CANONICAL_HOST" \
                    HostedZoneId="$HOSTED_ZONE_ID" \
                    SiteBucketName="$BUCKET_NAME" \
                    AgentApiDomain='${{ steps.agent_api.outputs.agent_api_domain }}' \
                    EnableAliases=false \
                  --no-fail-on-empty-changeset || true
                aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID" || true
                [[ -z "$APEX_SOURCE_ID" ]] || aws cloudfront associate-alias --alias "$APEX_HOST" --target-distribution-id "$APEX_SOURCE_ID" || true
                [[ -z "$WWW_SOURCE_ID" ]] || aws cloudfront associate-alias --alias "$CANONICAL_HOST" --target-distribution-id "$WWW_SOURCE_ID" || true
              fi
              if [[ "$changed" = '1' ]]; then
                jq -n --arg apex "${APEX_HOST}." --arg www "${CANONICAL_HOST}." --arg target "${DISTRIBUTION_DOMAIN}." --arg zone "$CLOUDFRONT_ZONE_ID" --slurpfile old "$original" '{
                  Comment:"Rollback failed Foundation CloudFront cutover",
                  Changes: ([
                    {Action:"DELETE",ResourceRecordSet:{Name:$apex,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                    {Action:"DELETE",ResourceRecordSet:{Name:$apex,Type:"AAAA",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                    {Action:"DELETE",ResourceRecordSet:{Name:$www,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                    {Action:"DELETE",ResourceRecordSet:{Name:$www,Type:"AAAA",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}}
                  ] + ($old[0] | map({Action:"CREATE",ResourceRecordSet:.})))
                }' > "$rollback"
                change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "file://$rollback" --query ChangeInfo.Id --output text)"
                aws route53 wait resource-record-sets-changed --id "$change_id" || true
              fi
            fi
          }
          trap rollback_dns EXIT

          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json)"
          jq --arg apex "${APEX_HOST}." --arg www "${CANONICAL_HOST}." '[.ResourceRecordSets[] | select((.Name==$apex or .Name==$www) and (.Type=="A" or .Type=="AAAA" or .Type=="CNAME"))]' <<<"$records" > "$original"

          if jq -e --arg target "${DISTRIBUTION_DOMAIN}." 'length == 4 and all(.[]; .AliasTarget.DNSName == $target)' "$original" >/dev/null; then
            echo 'Production web DNS already points to this distribution.'
          else
            jq -n --arg apex "${APEX_HOST}." --arg www "${CANONICAL_HOST}." --arg target "${DISTRIBUTION_DOMAIN}." --arg zone "$CLOUDFRONT_ZONE_ID" --slurpfile old "$original" '{
              Comment:"Move the Foundation parent website to AWS CloudFront",
              Changes: (($old[0] | map({Action:"DELETE",ResourceRecordSet:.})) + [
                {Action:"CREATE",ResourceRecordSet:{Name:$apex,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                {Action:"CREATE",ResourceRecordSet:{Name:$apex,Type:"AAAA",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                {Action:"CREATE",ResourceRecordSet:{Name:$www,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}},
                {Action:"CREATE",ResourceRecordSet:{Name:$www,Type:"AAAA",AliasTarget:{HostedZoneId:$zone,DNSName:$target,EvaluateTargetHealth:false}}}
              ])
            }' > "$RUNNER_TEMP/cloudfront-cutover.json"
            change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/cloudfront-cutover.json" --query ChangeInfo.Id --output text)"
            changed=1
            aws route53 wait resource-record-sets-changed --id "$change_id"
          fi

          for attempt in $(seq 1 30); do
            page="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 "https://${CANONICAL_HOST}/?live=${GITHUB_RUN_ID}" || true)"
            if grep -Fq 'Access. Assurance. Intelligence.' <<<"$page"; then break; fi
            test "$attempt" -lt 30
            sleep 10
          done
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "https://${CANONICAL_HOST}/publication/hsa-v1-2026" | grep -Fq 'Health Systems Assurance'
          apex_headers="$(mktemp)"
          apex_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$apex_headers" --output /dev/null --write-out '%{http_code}' "https://${APEX_HOST}/platforms?source=live")"
          apex_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print}' "$apex_headers")"
          test "$apex_status" = '308'
          test "$apex_location" = "https://${CANONICAL_HOST}/platforms?source=live"

          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --output json \
            | jq -S '[.ResourceRecordSets[] | select(.Type == "MX" or .Type == "TXT")]' \
            > "$RUNNER_TEMP/mail-records-after.json"
          cmp "$RUNNER_TEMP/mail-records-before.json" "$RUNNER_TEMP/mail-records-after.json"
          navigator_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/navigator-live.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{"question":"x"}' \
            "https://${CANONICAL_HOST}/api/navigator")"
          test "$navigator_status" = '400'
          verified=1
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Publish production receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ '${{ steps.dns.outputs.verified }}' = 'true' ]]; then
            result='SUCCESS — www and apex are live on AWS CloudFront; the apex redirects canonically and Google Workspace MX/TXT records are unchanged.'
          else
            result='FAILURE — AWS cutover did not verify; the workflow retained or restored the prior web DNS.'
          fi
          body="## AWS parent-site migration receipt\n\n**${result}**\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nCommit: \`${GITHUB_SHA}\`\nDistribution: \`${{ steps.target.outputs.distribution_id || 'not-created' }}\`"
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          printf '%b\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Require verified live deployment
        if: always()
        run: test '${{ steps.dns.outputs.verified }}' = 'true'
