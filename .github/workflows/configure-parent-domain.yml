name: Configure SozoRock Foundation parent domain
# Release trigger: approved ChatGPT Sites deployment -> www.sozorockfoundation.org (2026-08-20)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-parent-domain.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: sozorock-foundation-parent-domain-dns
  cancel-in-progress: false

jobs:
  configure-parent-domain:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationDnsRole' }}
      ZONE_NAME: sozorockfoundation.org.
      WWW_NAME: www.sozorockfoundation.org.
      CNAME_TARGET: custom-domains.chatgpt.site.
      OPENAI_NAME: _openai-site-verification.www.sozorockfoundation.org.
      OPENAI_VALUE: openai-site-verification=uRWqqC2NjJmoTR2EyEqF9JyNpVBzzmx61U0re5JhBjk
      CLOUDFLARE_NAME: _cf-custom-hostname.www.sozorockfoundation.org.
      CLOUDFLARE_VALUE: a3a592c6-be9a-4592-90d6-dd20c2e1af6d

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure AWS credentials with GitHub OIDC
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: SozoRockFoundation-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Validate zone and update only authorized records
        id: dns
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          zone_json="$(aws route53 list-hosted-zones-by-name --dns-name "$ZONE_NAME" --output json)"
          mapfile -t zone_ids < <(
            jq -r --arg name "$ZONE_NAME" '.HostedZones[] | select(.Name == $name and .Config.PrivateZone == false) | .Id' <<<"$zone_json"
          )

          if [[ ${#zone_ids[@]} -ne 1 ]]; then
            echo "Expected exactly one public hosted zone named $ZONE_NAME; found ${#zone_ids[@]}." >&2
            exit 1
          fi

          zone_id="${zone_ids[0]#/hostedzone/}"
          actual_zone_name="$(aws route53 get-hosted-zone --id "$zone_id" --query 'HostedZone.Name' --output text)"
          [[ "$actual_zone_name" == "$ZONE_NAME" ]]

          current_records="$(aws route53 list-resource-record-sets --hosted-zone-id "$zone_id" --output json)"
          existing_www="$(jq -c --arg name "$WWW_NAME" '[.ResourceRecordSets[] | select(.Name == $name)]' <<<"$current_records")"

          unexpected_www_types="$(jq -r '.[] | select(.Type != "CNAME") | .Type' <<<"$existing_www")"
          [[ -z "$unexpected_www_types" ]] || { echo "Refusing unexpected record type(s) at $WWW_NAME: $unexpected_www_types" >&2; exit 1; }

          advanced_www_records="$(jq -r '.[] | select(has("SetIdentifier") or has("AliasTarget") or has("TrafficPolicyInstanceId")) | .Type' <<<"$existing_www")"
          [[ -z "$advanced_www_records" ]] || { echo "Refusing advanced-routing record at $WWW_NAME." >&2; exit 1; }

          change_batch="$(
            jq -n \
              --arg www_name "$WWW_NAME" \
              --arg cname_target "$CNAME_TARGET" \
              --arg openai_name "$OPENAI_NAME" \
              --arg openai_value "\"$OPENAI_VALUE\"" \
              --arg cloudflare_name "$CLOUDFLARE_NAME" \
              --arg cloudflare_value "\"$CLOUDFLARE_VALUE\"" \
              '{
                Comment: "Attach the SozoRock Foundation parent domain to the published ChatGPT Site",
                Changes: [
                  {Action: "UPSERT", ResourceRecordSet: {Name: $www_name, Type: "CNAME", TTL: 300, ResourceRecords: [{Value: $cname_target}]}},
                  {Action: "UPSERT", ResourceRecordSet: {Name: $openai_name, Type: "TXT", TTL: 300, ResourceRecords: [{Value: $openai_value}]}},
                  {Action: "UPSERT", ResourceRecordSet: {Name: $cloudflare_name, Type: "TXT", TTL: 300, ResourceRecords: [{Value: $cloudflare_value}]}}
                ]
              }'
          )"

          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$zone_id" --change-batch "$change_batch" --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"

          updated_records="$(aws route53 list-resource-record-sets --hosted-zone-id "$zone_id" --output json)"
          actual_cname="$(jq -r --arg name "$WWW_NAME" '.ResourceRecordSets[] | select(.Name == $name and .Type == "CNAME") | .ResourceRecords[0].Value' <<<"$updated_records")"
          actual_openai="$(jq -r --arg name "$OPENAI_NAME" '.ResourceRecordSets[] | select(.Name == $name and .Type == "TXT") | .ResourceRecords[0].Value' <<<"$updated_records")"
          actual_cloudflare="$(jq -r --arg name "$CLOUDFLARE_NAME" '.ResourceRecordSets[] | select(.Name == $name and .Type == "TXT") | .ResourceRecords[0].Value' <<<"$updated_records")"

          [[ "$actual_cname" == "$CNAME_TARGET" ]]
          [[ "$actual_openai" == "\"$OPENAI_VALUE\"" ]]
          [[ "$actual_cloudflare" == "\"$CLOUDFLARE_VALUE\"" ]]

          {
            echo "route53_change_id=$change_id"
            echo "www_cname=$actual_cname"
            echo "openai_verification=$actual_openai"
            echo "cloudflare_verification=$actual_cloudflare"
          } >> "$GITHUB_OUTPUT"

      - name: Commit deployment diagnostic receipt
        if: always()
        shell: bash
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          DNS_OUTCOME: ${{ steps.dns.outcome }}
          ROUTE53_CHANGE_ID: ${{ steps.dns.outputs.route53_change_id }}
          WWW_CNAME: ${{ steps.dns.outputs.www_cname }}
          OPENAI_VERIFICATION: ${{ steps.dns.outputs.openai_verification }}
          CLOUDFLARE_VERIFICATION: ${{ steps.dns.outputs.cloudflare_verification }}
        run: |
          set -euo pipefail
          status="failed"
          if [[ "$AWS_OUTCOME" == "success" && "$DNS_OUTCOME" == "success" ]]; then
            status="success"
          fi

          mkdir -p deployments
          jq -n \
            --arg status "$status" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg aws_outcome "$AWS_OUTCOME" \
            --arg dns_outcome "$DNS_OUTCOME" \
            --arg route53_change_id "$ROUTE53_CHANGE_ID" \
            --arg www_cname "$WWW_CNAME" \
            --arg openai_verification "$OPENAI_VERIFICATION" \
            --arg cloudflare_verification "$CLOUDFLARE_VERIFICATION" \
            '{status:$status, completed_at:$completed_at, workflow_run_id:$workflow_run_id, aws_outcome:$aws_outcome, dns_outcome:$dns_outcome, route53_change_id:$route53_change_id, www_cname:$www_cname, openai_verification:$openai_verification, cloudflare_verification:$cloudflare_verification, scope:"www only; apex, mail, nameservers, and unrelated subdomains unchanged"}' \
            > deployments/www-cutover.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deployments/www-cutover.json
          if ! git diff --cached --quiet; then
            git commit -m "deploy(www): record parent-domain cutover $status"
            git push origin HEAD:main
          fi

      - name: Fail workflow if cutover did not verify
        if: steps.aws.outcome != 'success' || steps.dns.outcome != 'success'
        shell: bash
        run: |
          echo "Parent-domain cutover did not verify. AWS outcome: ${{ steps.aws.outcome }}; DNS outcome: ${{ steps.dns.outcome }}" >&2
          exit 1
