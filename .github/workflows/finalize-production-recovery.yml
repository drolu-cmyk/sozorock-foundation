name: Finalize Foundation production recovery

on:
  workflow_run:
    workflows: ["Production domain diagnostics"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: foundation-production-recovery-finalize
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: '791860731989'
  AI_LAB_RECOVERY_ROLE: arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole
  AI_LAB_RECOVERY_ROLE_NAME: GitHubActionsSozorockAiLabDeployRole
  FOUNDATION_DEPLOY_ROLE_NAME: GitHubActionsSozorockFoundationSiteDeployRole
  PARENT_LAMBDA_ROLE_NAME: SozoRockFoundationParentLambdaRole
  PARENT_API_NAME: SozoRockFoundationParentSite
  RECOVERY_ISSUE: '84'

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether recovery still needs finalization
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RECOVERY_ISSUE}" --jq '.state')"
          if [[ "$state" = 'open' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment receipt is already closed; no AWS finalization is required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove canonical and retired-domain behavior
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_redirect() {
            local source="$1" expected="$2"
            headers="$(curl --proto '=https' --tlsv1.2 --silent --show-error --head --max-time 20 "$source")"
            status="$(awk '/^HTTP\// {code=$2} END {print code}' <<<"$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); value=$0} END {print value}' <<<"$headers")"
            test "$status" = '308'
            test "$location" = "$expected"
          }
          check_redirect 'https://sozorockfoundation.org/recovery-proof?source=finalize' 'https://www.sozorockfoundation.org/recovery-proof?source=finalize'
          check_redirect 'https://sozorockhealth.com/' 'https://health.sozorockfoundation.org/'
          check_redirect 'https://www.sozorockhealth.com/' 'https://health.sozorockfoundation.org/'
          check_redirect 'https://sozorockhealth.com/cb-cap' 'https://cbcap.sozorockfoundation.org/'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error 'https://www.sozorockfoundation.org/' >/dev/null
      - name: Prove parent contact and publication access end to end
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          origin='https://www.sozorockfoundation.org'
          contact_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/parent-contact.json" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $origin" \
            --header 'Content-Type: application/json' \
            --data '{"name":"Foundation Release Check","email":"success@simulator.amazonses.com","organization":"The SozoRock Foundation","inquiryType":"Support research and publications","role":"Foundation or funder","stateOrCounty":"Albany, New York","message":"Synthetic production verification for the parent Foundation inquiry route and Health storage path.","website":"","consent":true}' \
            "$origin/api/contact")"
          test "$contact_status" = '200'
          jq -e '.message | type == "string" and length > 0' "$RUNNER_TEMP/parent-contact.json" >/dev/null

          access_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/parent-access.json" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $origin" \
            --header 'Content-Type: application/json' \
            --data '{"firstName":"Foundation","lastName":"Release","email":"success@simulator.amazonses.com","organization":"The SozoRock Foundation","sector":"Foundation or funder","cityOrRegion":"Albany","state":"New York","country":"United States","reason":"Synthetic production verification for parent publication access and email delivery.","website":"","deliveryConsent":true,"updatesConsent":false}' \
            "$origin/api/publications/access/hsa-v1-2026")"
          test "$access_status" = '200'
          jq -e '.message == "Check your email for a verification link. It expires in 30 minutes."' "$RUNNER_TEMP/parent-access.json" >/dev/null
      - name: Assume temporary AI Lab recovery role one final time
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AI_LAB_RECOVERY_ROLE }}
          role-session-name: FoundationRecoveryFinalize-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Install persistent signed-smoke boundary and remove temporary recovery authority
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"

          api_id="$(aws apigatewayv2 get-apis --output json | jq -r --arg name "$PARENT_API_NAME" '.Items[]? | select(.Name == $name) | .ApiId' | head -n1)"
          test -n "$api_id"
          cat > "$RUNNER_TEMP/foundation-agent-invoke.json" <<EOF
          {"Version":"2012-10-17","Statement":[{
            "Sid":"InvokeOnlyFoundationAgentInternalApi",
            "Effect":"Allow",
            "Action":"execute-api:Invoke",
            "Resource":[
              "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${api_id}/*/GET/internal/health",
              "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${api_id}/*/GET/internal/v1/graphs",
              "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${api_id}/*/POST/internal/v1/run"
            ]
          }]}
          EOF
          aws iam put-role-policy \
            --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" \
            --policy-name SozoRockFoundationAgentControlPlaneInvoke \
            --policy-document "file://$RUNNER_TEMP/foundation-agent-invoke.json"
          invoke_policy="$(aws iam get-role-policy --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationAgentControlPlaneInvoke --query 'PolicyDocument' --output json)"
          jq -e --arg api "$api_id" --arg region "$AWS_REGION" --arg account "$ACCOUNT_ID" '
            any(.Statement[];
              .Sid == "InvokeOnlyFoundationAgentInternalApi" and
              .Action == "execute-api:Invoke" and
              (.Resource | sort) == ([
                "arn:aws:execute-api:\($region):\($account):\($api)/*/GET/internal/health",
                "arn:aws:execute-api:\($region):\($account):\($api)/*/GET/internal/v1/graphs",
                "arn:aws:execute-api:\($region):\($account):\($api)/*/POST/internal/v1/run"
              ] | sort))
          ' <<<"$invoke_policy" >/dev/null

          if aws iam get-role-policy --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationRecoveryAddon >/dev/null 2>&1; then
            aws iam delete-role-policy --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationRecoveryAddon
          fi
          if aws iam get-role-policy --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationRecoveryAddon >/dev/null 2>&1; then
            echo 'Foundation recovery add-on remained after cleanup.' >&2
            exit 1
          fi

          model_policy="$(aws iam get-role-policy --role-name "$PARENT_LAMBDA_ROLE_NAME" --policy-name SozoRockFoundationAgentModelInference --query 'PolicyDocument' --output json)"
          jq -e 'any(.Statement[]; .Sid == "FoundationAgentSolInferenceOnly")' <<<"$model_policy" >/dev/null

          cat > "$RUNNER_TEMP/ai-lab-normal-trust.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Effect":"Allow",
              "Principal":{"Federated":"arn:aws:iam::791860731989:oidc-provider/token.actions.githubusercontent.com"},
              "Action":"sts:AssumeRoleWithWebIdentity",
              "Condition":{
                "StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},
                "StringLike":{"token.actions.githubusercontent.com:sub":[
                  "repo:drolu-cmyk/sozorock-ai-lab:environment:production",
                  "repo:drolu-cmyk/sozorock-ai-lab:ref:refs/heads/main"
                ]}
              }
            }]
          }
          JSON
          aws iam update-assume-role-policy \
            --role-name "$AI_LAB_RECOVERY_ROLE_NAME" \
            --policy-document "file://$RUNNER_TEMP/ai-lab-normal-trust.json"

          actual="$(aws iam get-role --role-name "$AI_LAB_RECOVERY_ROLE_NAME" --query 'Role.AssumeRolePolicyDocument' --output json)"
          expected='["repo:drolu-cmyk/sozorock-ai-lab:environment:production","repo:drolu-cmyk/sozorock-ai-lab:ref:refs/heads/main"]'
          received="$(jq -c '.Statement[] | select(.Action == "sts:AssumeRoleWithWebIdentity") | .Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort' <<<"$actual")"
          test "$received" = "$expected"
      - name: Close deployment receipt with verified completion
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/final-recovery.md" <<EOF
          ## Foundation production recovery complete

          The apex domain, canonical `www`, retired Health domains, CB-CAP legacy path, parent contact form, and parent publication-access verification path passed live production checks.

          Temporary Foundation access to the AI Lab deploy role and the temporary recovery IAM add-on were removed. The GPT-5.6 Sol model-inference policy remains on the private runtime, and the Foundation deploy role now retains only an exact three-route `execute-api:Invoke` boundary so every future agent deployment can prove a real signed model-backed graph smoke.
          EOF
          gh issue comment "$RECOVERY_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/final-recovery.md"
          gh issue close "$RECOVERY_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
