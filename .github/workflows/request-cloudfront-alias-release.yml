name: Request CloudFront alias release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/request-cloudfront-alias-release.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: '791860731989'
  AI_LAB_RECOVERY_ROLE: arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole
  FOUNDATION_DEPLOY_ROLE: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  FOUNDATION_DEPLOY_ROLE_NAME: GitHubActionsSozorockFoundationSiteDeployRole
  TARGET_DISTRIBUTION_ID: E1ZE8Y3QUBJ59K
  CANONICAL_HOST: www.sozorockfoundation.org
  RECEIPT_ISSUE: '84'

jobs:
  request:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assume temporarily trusted recovery authority
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.AI_LAB_RECOVERY_ROLE }}
          role-session-name: FoundationAliasSupportGrant-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Grant only AWS Support case permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          cat > "$RUNNER_TEMP/support-policy.json" <<'JSON'
          {"Version":"2012-10-17","Statement":[{
            "Sid":"FoundationCloudFrontAliasSupportOnly",
            "Effect":"Allow",
            "Action":["support:CreateCase","support:DescribeCases","support:DescribeServices","support:DescribeSeverityLevels"],
            "Resource":"*"
          }]}
          JSON
          aws iam put-role-policy \
            --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" \
            --policy-name SozoRockFoundationCloudFrontAliasSupport \
            --policy-document "file://$RUNNER_TEMP/support-policy.json"

      - name: Switch to the Foundation role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.FOUNDATION_DEPLOY_ROLE }}
          role-session-name: FoundationAliasSupport-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Open or reuse the CloudFront alias-release case
        id: support
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          subject='Release www.sozorockfoundation.org from inaccessible enabled CloudFront source'
          existing="$(aws support describe-cases --include-resolved-cases false --language en --output json 2>"$RUNNER_TEMP/support-error.txt" || true)"
          if [[ -n "$existing" ]]; then
            case_id="$(jq -r --arg subject "$subject" '.cases[]? | select(.subject == $subject) | .caseId' <<<"$existing" | head -n1)"
          else
            case_id=''
          fi
          if [[ -z "$case_id" ]]; then
            services="$(aws support describe-services --service-code-list amazon-cloudfront --language en --output json)"
            category_code="$(jq -r '[.services[0].categories[]? | select((.name + " " + .code) | test("domain|alternate|distribution"; "i"))][0].code // .services[0].categories[0].code // "other"' <<<"$services")"
            conflicts="$(aws cloudfront list-conflicting-aliases --distribution-id "$TARGET_DISTRIBUTION_ID" --alias "$CANONICAL_HOST" --output json)"
            source_distribution="$(jq -r --arg target "$TARGET_DISTRIBUTION_ID" '[.ConflictingAliasesList.Items[]? | select(.DistributionId != $target)][0].DistributionId // "not disclosed"' <<<"$conflicts")"
            body="Please move or release the alternate domain name ${CANONICAL_HOST} to CloudFront distribution ${TARGET_DISTRIBUTION_ID} in AWS account ${ACCOUNT_ID}. The current source distribution (${source_distribution}) is enabled in another account and is no longer accessible through the original Sites project. CloudFront ownership TXT verification is present and the target has a valid certificate. AssociateAlias returns IllegalUpdate because the inaccessible cross-account source is enabled. AWS documentation directs this state to Support. The Foundation authorizes the move and needs the exact hostname released without changing apex or mail DNS."
            case_id="$(aws support create-case \
              --subject "$subject" \
              --service-code amazon-cloudfront \
              --category-code "$category_code" \
              --severity-code low \
              --communication-body "$body" \
              --language en \
              --issue-type technical \
              --query caseId \
              --output text 2>"$RUNNER_TEMP/support-error.txt")"
          fi
          test -n "$case_id"
          test "$case_id" != 'None'
          echo "case_id=$case_id" >> "$GITHUB_OUTPUT"

      - name: Publish support receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case_id='${{ steps.support.outputs.case_id }}'
          if [[ '${{ steps.support.outcome }}' = 'success' && -n "$case_id" ]]; then
            body="CloudFront alias-release request opened or reused successfully for \`${CANONICAL_HOST}\`. AWS Support case: \`${case_id}\`. The verified target remains isolated and production DNS remains fail-closed until AWS releases the cross-account alias."
          else
            error="$(tr '\n' ' ' < "$RUNNER_TEMP/support-error.txt" 2>/dev/null | sed 's/`/'"'"'/g' | cut -c1-500)"
            body="CloudFront alias-release request could not be opened automatically. AWS response: \`${error:-not supplied}\`. The verified target remains isolated and production DNS was not changed."
          fi
          gh issue comment "$RECEIPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-assume recovery authority for permission cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.AI_LAB_RECOVERY_ROLE }}
          role-session-name: FoundationAliasSupportCleanup-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Remove temporary AWS Support permission
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          aws iam delete-role-policy \
            --role-name "$FOUNDATION_DEPLOY_ROLE_NAME" \
            --policy-name SozoRockFoundationCloudFrontAliasSupport

      - name: Require a recorded AWS Support case
        if: always()
        shell: bash
        run: |
          test '${{ steps.support.outcome }}' = 'success'
          test -n '${{ steps.support.outputs.case_id }}'
