name: Monitor CloudFront alias release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-cloudfront-alias-release.yml
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: sozorock-foundation-alias-release-monitor
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::791860731989:role/GitHubActionsSozorockFoundationSiteDeployRole
  TARGET_DISTRIBUTION_ID: E1ZE8Y3QUBJ59K
  CANONICAL_HOST: www.sozorockfoundation.org
  PARENT_WORKFLOW: deploy-parent-cloudfront.yml

jobs:
  check:
    if: github.repository == 'drolu-cmyk/sozorock-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume the Foundation deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: FoundationAliasMonitor-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Dispatch the verified cutover when the foreign alias is gone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          conflicts="$(aws cloudfront list-conflicting-aliases \
            --distribution-id "$TARGET_DISTRIBUTION_ID" \
            --alias "$CANONICAL_HOST" \
            --output json)"
          foreign_count="$(jq --arg target "$TARGET_DISTRIBUTION_ID" \
            '[.ConflictingAliasesList.Items[]? | select(.DistributionId != $target)] | length' \
            <<<"$conflicts")"
          if [[ "$foreign_count" -gt 0 ]]; then
            echo 'The inaccessible source still owns the canonical alias; no mutation was attempted.'
            exit 0
          fi

          active_count="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$PARENT_WORKFLOW" \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested")] | length')"
          if [[ "$active_count" -gt 0 ]]; then
            echo 'A parent CloudFront deployment is already active; no duplicate was dispatched.'
            exit 0
          fi

          gh workflow run "$PARENT_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          echo 'The foreign alias is gone; the verified parent CloudFront cutover was dispatched.'
