AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege GitHub OIDC role for the SozoRock Foundation parent-domain DNS workflow.

Parameters:
  HostedZoneId:
    Type: String
    Description: Public Route 53 hosted-zone ID for sozorockfoundation.org

Resources:
  GitHubActionsSozorockFoundationDnsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsSozorockFoundationDnsRole
      Description: Allows only the SozoRock Foundation repository to manage the three parent-domain DNS records.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSozoRockFoundationMain
            Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:drolu-cmyk@271617784/sozorock-foundation@1337104562:ref:refs/heads/main
      Policies:
        - PolicyName: SozoRockFoundationParentDns
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DiscoverPublicHostedZone
                Effect: Allow
                Action:
                  - route53:ListHostedZonesByName
                Resource: '*'
              - Sid: ReadTargetHostedZone
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
              - Sid: ChangeOnlyAuthorizedParentRecords
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - www.sozorockfoundation.org
                      - _openai-site-verification.www.sozorockfoundation.org
                      - _cf-custom-hostname.www.sozorockfoundation.org
                    route53:ChangeResourceRecordSetsRecordTypes:
                      - CNAME
                      - TXT
                    route53:ChangeResourceRecordSetsActions:
                      - UPSERT
              - Sid: WaitForRoute53Change
                Effect: Allow
                Action:
                  - route53:GetChange
                Resource: arn:aws:route53:::change/*

Outputs:
  RoleArn:
    Description: Set this as the AWS_ROLE_TO_ASSUME repository variable only if the default role name is changed.
    Value: !GetAtt GitHubActionsSozorockFoundationDnsRole.Arn
